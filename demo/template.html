<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Nexity · Studio Pages Lots</title>
<style>
/*__FONTS__*/
/*__TOKENS__*/

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  background: var(--arch-limestone);
  color: var(--nexity-obsidian);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: 0;
  background: transparent;
  color: inherit;
  padding: 0;
}

.mono { font-family: var(--font-mono); }

.studio {
  display: grid;
  grid-template-rows: 48px minmax(0, 1fr) 56px;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  background: var(--arch-limestone);
}

/* TOPBAR (48px) */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 18px;
  background: #ffffff;
  border-bottom: 1px solid var(--arch-oak-border);
  z-index: 20;
}

.tb-left {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

.tb-logo {
  height: 18px;
  width: auto;
  display: block;
}

.tb-sep {
  width: 1px;
  height: 18px;
  background: var(--arch-oak-border);
}

.tb-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--nexity-obsidian);
  white-space: nowrap;
}

.tb-ref {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--arch-slate-text);
  background: var(--arch-sandstone);
  border: 1px solid var(--arch-oak-border);
  border-radius: 4px;
  padding: 2px 7px;
  white-space: nowrap;
}

.tb-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.tb-chip {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--arch-slate-text);
  padding: 3px 9px;
  border: 1px solid var(--arch-oak-border);
  border-radius: var(--radius-pill);
  background: var(--arch-limestone);
  white-space: nowrap;
}

.tb-keys {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--arch-slate-text);
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.tb-btn {
  font-size: 12px;
  font-weight: 600;
  padding: 5px 11px;
  border: 1px solid var(--arch-oak-border);
  border-radius: 6px;
  background: #ffffff;
  color: var(--nexity-obsidian);
  transition: background-color 140ms ease, border-color 140ms ease;
}

.tb-btn:hover {
  background: var(--arch-sandstone);
  border-color: var(--nexity-obsidian);
}

/* MAIN 3-COLUMN WORKSPACE */
.main {
  display: grid;
  grid-template-columns: 278px minmax(0, 1fr) clamp(320px, 27vw, 404px);
  min-height: 0;
  overflow: hidden;
  background: var(--arch-limestone);
}

/* COL 1 : SIDEBAR FLUX MBI */
#side {
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  background: #ffffff;
  border-right: 1px solid var(--arch-oak-border);
}

.prog-head {
  border-bottom: 1px solid var(--arch-oak-border);
}

.prog-photo-wrap {
  position: relative;
  height: 84px;
  overflow: hidden;
  background: var(--arch-sandstone);
}

.prog-photo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.prog-zone {
  position: absolute;
  top: 7px;
  right: 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(17, 19, 21, 0.84);
  color: #ffffff;
}

.prog-info {
  padding: 10px 14px 11px;
}

.prog-name {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.2;
  color: var(--nexity-obsidian);
}

.prog-meta {
  margin-top: 3px;
  font-size: 11px;
  color: var(--arch-slate-text);
}

.price-box {
  padding: 10px 14px;
  background: var(--arch-limestone);
  border-bottom: 1px solid var(--arch-oak-border);
}

.price-lbl {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--arch-slate-text);
}

.price-row {
  margin-top: 4px;
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}

.price-old {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--guard-quarantine-fg);
  text-decoration: line-through;
}

.price-val {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--nexity-obsidian);
}

.price-sub {
  margin-top: 3px;
  font-size: 11px;
  color: var(--arch-slate-text);
}

.flux-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 9px 14px 7px;
  border-bottom: 1px solid var(--arch-oak-border);
  background: #ffffff;
}

.flux-title {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--nexity-obsidian);
  white-space: nowrap;
  flex-shrink: 0;
}

.flux-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--guard-legal-warn-bg);
  color: var(--guard-legal-warn-fg);
}

.lot-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 6px 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.lot-row {
  width: 100%;
  text-align: left;
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 6px 7px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: #ffffff;
  transition: background-color 130ms ease, border-color 130ms ease;
}

.lot-row:hover {
  background: var(--arch-limestone);
  border-color: var(--arch-oak-border);
}

.lot-row.is-active {
  background: var(--nexity-obsidian);
  border-color: var(--nexity-obsidian);
  color: #ffffff;
}

.lot-thumb {
  position: relative;
  width: 46px;
  height: 32px;
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid var(--arch-oak-border);
  background: var(--arch-sandstone);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.lot-row.is-active .lot-thumb {
  border-color: rgba(255, 255, 255, 0.28);
}

.lot-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.lot-thumb-empty {
  font-family: var(--font-mono);
  font-size: 9px;
  text-align: center;
  line-height: 1.15;
  color: var(--arch-slate-text);
  padding: 2px;
}

.lot-main {
  min-width: 0;
}

.lot-id {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 800;
  line-height: 1.2;
}

.lot-sub {
  font-size: 10px;
  color: var(--arch-slate-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.lot-row.is-active .lot-sub {
  color: rgba(255, 255, 255, 0.72);
}

.lot-tag {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  padding: 2px 5px;
  border-radius: 4px;
  white-space: nowrap;
}

.tag-ok { background: var(--guard-verified-bg); color: var(--guard-verified-fg); }
.tag-quar { background: var(--guard-quarantine-bg); color: var(--guard-quarantine-fg); }
.tag-sold { background: var(--arch-sandstone); color: var(--arch-slate-text); }
.tag-temoin { background: var(--nexity-red-primary); color: #ffffff; }
.tag-wait { background: var(--arch-limestone); color: var(--arch-slate-text); border: 1px solid var(--arch-oak-border); }

.lot-row.is-active .tag-wait {
  background: rgba(255, 255, 255, 0.16);
  color: #ffffff;
  border-color: rgba(255, 255, 255, 0.25);
}

.lot-row.is-active .tag-sold {
  background: rgba(255, 255, 255, 0.18);
  color: #ffffff;
}

/* Scan line overlay during step 1 */
@keyframes scanSweep {
  0% { top: 0%; opacity: 0.95; }
  50% { top: calc(100% - 2px); opacity: 1; }
  100% { top: 0%; opacity: 0.95; }
}

.scan-line {
  position: absolute;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--nexity-red-primary);
  pointer-events: none;
  animation: scanSweep 1.1s linear infinite;
  z-index: 4;
}

.scan-line.is-tall {
  height: 3px;
}

/* COL 2 : WORKSPACE LOT DOSSIER */
#work {
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  background: var(--arch-limestone);
  border-right: 1px solid var(--arch-oak-border);
}

.work-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 16px;
  background: #ffffff;
  border-bottom: 1px solid var(--arch-oak-border);
}

.work-title-wrap {
  display: flex;
  align-items: baseline;
  gap: 12px;
  min-width: 0;
  flex-wrap: nowrap;
}

.work-lot {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--nexity-obsidian);
  flex-shrink: 0;
  white-space: nowrap;
}

.work-specs {
  font-size: 12px;
  color: var(--arch-slate-text);
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.work-status {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.04em;
  padding: 4px 9px;
  border-radius: 4px;
  white-space: nowrap;
}

.st-quar { background: var(--guard-quarantine-bg); color: var(--guard-quarantine-fg); border: 1px solid rgba(180, 35, 24, 0.25); }
.st-sold { background: var(--arch-sandstone); color: var(--arch-slate-text); border: 1px solid var(--arch-oak-border); }
.st-temoin { background: var(--nexity-red-soft); color: var(--nexity-red-banner); border: 1px solid rgba(255, 0, 45, 0.28); }
.st-ok { background: var(--guard-verified-bg); color: var(--guard-verified-fg); border: 1px solid rgba(2, 122, 72, 0.22); }
.st-idle { background: var(--arch-limestone); color: var(--arch-slate-text); border: 1px solid var(--arch-oak-border); }

#notice {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 12px;
  padding: 8px 16px;
  background: var(--arch-sandstone);
  border-bottom: 1px solid var(--arch-oak-border);
  min-height: 36px;
}

.notice-msg {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12px;
  color: var(--nexity-obsidian);
  flex: 1 1 240px;
  min-width: 0;
}

.sq-red {
  width: 7px;
  height: 7px;
  background: var(--nexity-red-primary);
  flex-shrink: 0;
}

.notice-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  margin-left: auto;
}

.notice-metric {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--arch-slate-text);
}

.btn-temoin {
  font-size: 12px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: var(--radius-pill);
  background: var(--nexity-red-primary);
  color: #ffffff;
  white-space: nowrap;
  transition: background-color 140ms ease;
}

.btn-temoin:hover { background: var(--nexity-red-banner); }

.btn-temoin.is-done {
  background: var(--guard-verified-bg);
  color: var(--guard-verified-fg);
  border: 1px solid rgba(2, 122, 72, 0.3);
}

.work-body {
  display: grid;
  grid-template-columns: 62fr 38fr;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

/* LEFT WORK PANEL: 2D PLAN & SURFACES */
#proofPlan {
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  padding: 10px 14px 12px;
  border-right: 1px solid var(--arch-oak-border);
  background: var(--arch-limestone);
}

.panel-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
  flex-shrink: 0;
}

.panel-id {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}

.panel-kicker {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--nexity-obsidian);
  white-space: nowrap;
  flex-shrink: 0;
}

.panel-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--arch-slate-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.plan-zoom-btn {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--arch-oak-border);
  background: #ffffff;
  color: var(--nexity-obsidian);
  white-space: nowrap;
  flex-shrink: 0;
}

.plan-zoom-btn:hover {
  border-color: var(--nexity-obsidian);
  background: var(--arch-sandstone);
}

.plan-stage {
  position: relative;
  flex: 1;
  min-height: 0;
  background: #ffffff;
  border: 1px solid var(--arch-oak-border);
  border-radius: 6px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.plan-box {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.plan-box img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
}

#planSvg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#planSvg .hl {
  fill: transparent;
  stroke: transparent;
  stroke-width: 4;
  transition: fill 150ms ease, stroke 150ms ease;
}

#planSvg .hl.is-on {
  fill: rgba(255, 0, 45, 0.16);
  stroke: #FF002D;
}

.quar-stamp {
  position: absolute;
  top: 14px;
  left: 14px;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.08em;
  padding: 5px 11px;
  color: var(--guard-quarantine-fg);
  background: rgba(254, 243, 242, 0.94);
  border: 2px solid var(--guard-quarantine-fg);
  border-radius: 4px;
  transform: rotate(-4deg);
  pointer-events: none;
}

.plan-empty {
  text-align: center;
  padding: 20px;
  max-width: 300px;
}

.plan-empty-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--nexity-obsidian);
}

.plan-empty-sub {
  margin-top: 5px;
  font-size: 12px;
  color: var(--arch-slate-text);
}

.surf-strip {
  margin-top: 8px;
  flex-shrink: 0;
  background: #ffffff;
  border: 1px solid var(--arch-oak-border);
  border-radius: 6px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.surf-metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.surf-cell {
  min-width: 0;
}

.surf-k {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  color: var(--arch-slate-text);
}

.surf-v {
  margin-top: 1px;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--nexity-obsidian);
}

.surf-v.is-err { color: var(--guard-quarantine-fg); }
.surf-v.is-ok { color: var(--guard-verified-fg); }

.crop-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding-top: 8px;
  border-top: 1px solid var(--arch-oak-border);
}

.crop-img {
  width: 285px;
  max-width: 100%;
  height: 72px;
  background-repeat: no-repeat;
  border: 1px solid var(--guard-quarantine-fg);
  border-radius: 4px;
  background-color: #ffffff;
  flex-shrink: 0;
}

.crop-note {
  font-size: 11px;
  line-height: 1.35;
  color: var(--guard-quarantine-fg);
  font-weight: 600;
  min-width: 120px;
  flex: 1;
}

/* RIGHT WORK PANEL: PROOFS & SOURCES */
#proofSources {
  overflow-y: auto;
  min-height: 0;
  padding: 10px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #ffffff;
}

.src-block {
  border-bottom: 1px solid var(--arch-oak-border);
  padding-bottom: 10px;
}

.src-block:last-child {
  border-bottom: 0;
  padding-bottom: 2px;
}

.src-block-title {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--arch-slate-text);
  margin-bottom: 7px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.src-block-title span {
  white-space: nowrap;
}

.src-block-title.is-alert {
  color: var(--guard-quarantine-fg);
}

.alert-list {
  margin: 0;
  padding-left: 16px;
  font-size: 12px;
  color: var(--guard-quarantine-fg);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.src-row {
  padding: 6px 8px;
  border-radius: 5px;
  border: 1px solid transparent;
  margin-bottom: 4px;
  background: var(--arch-limestone);
  transition: border-color 130ms ease, background-color 130ms ease;
}

.src-row:last-child { margin-bottom: 0; }

.src-row.is-lit {
  border-color: var(--nexity-red-primary);
  background: var(--nexity-red-soft);
}

.src-kv {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  font-size: 11px;
}

.src-k {
  color: var(--arch-slate-text);
  font-size: 11px;
  white-space: nowrap;
}

.src-v {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--nexity-obsidian);
  text-align: right;
  min-width: 0;
  overflow-wrap: break-word;
}

.sing-head {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.sing-lbl {
  font-size: 11.5px;
  font-weight: 700;
  line-height: 1.3;
  color: var(--nexity-obsidian);
}

.sing-val {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--nexity-red-banner);
}

.sing-bar-track {
  margin-top: 5px;
  height: 4px;
  width: 100%;
  background: var(--arch-oak-border);
  border-radius: 2px;
  overflow: hidden;
}

.sing-bar-track.is-ref {
  margin-top: 3px;
}

.sing-bar-fill {
  height: 100%;
  background: var(--nexity-red-primary);
  border-radius: 2px;
}

.sing-bar-fill.is-ref {
  background: var(--arch-slate-text);
}

.sing-ref {
  margin-top: 3px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--arch-slate-text);
}

.sing-guard {
  margin-top: 5px;
  font-size: 11px;
  line-height: 1.3;
  color: var(--arch-slate-text);
  display: flex;
  align-items: baseline;
  gap: 6px;
  flex-wrap: wrap;
}

.struck-bad {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--guard-quarantine-fg);
  text-decoration: line-through;
}

.scope-ok {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--guard-verified-fg);
}

.clause-id {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 800;
  color: var(--nexity-red-banner);
}

.clause-rub {
  font-size: 11px;
  font-weight: 700;
  color: var(--nexity-obsidian);

<body>
<div class="studio">
  <header class="topbar">
    <div class="tb-left">
      <img id="logoTop" class="tb-logo" alt="Nexity">
      <span class="tb-sep"></span>

    </div>
    <div class="tb-right">
      <span class="tb-keys">Espace suite · P vue · L lot · T preuves · Z zoom · R reset</span>
      <span id="srcChip" class="tb-chip"></span>
      <button id="btnReset" class="tb-btn" type="button">Réinitialiser</button>
    </div>
  </header>

  <main class="main">
    <aside id="side" aria-label="Flux programme MBI"></aside>

    <section id="work" aria-label="Dossier de contrôle et preuves du lot">
      <div id="workHead" class="work-head"></div>
      <div id="notice"></div>
      <div class="work-body">
        <div id="proofPlan"></div>
        <div id="proofSources"></div>
      </div>
    </section>

    <aside id="phoneCol" aria-label="Prévisualisation mobile">
      <div class="phone-controls">
        <div id="segVue" class="seg" role="tablist" aria-label="Vue mobile">
          <button type="button" class="seg-btn" data-vue="portail">Portail</button>
          <button type="button" class="seg-btn" data-vue="nexity">nexity.fr</button>
        </div>
        <div id="segLot" class="seg" aria-label="Lots générés"></div>
      </div>

          <div class="phone-notch"></div>
          <div id="app" class="phone-screen"></div>

  <div class="zoom-card">
    <div class="zoom-head">
      <span id="zoomTitle" class="panel-kicker">Plan 2D</span>
      <button id="zoomClose" class="tb-btn" type="button">Fermer (Échap)</button>
    </div>
    <div id="zoomBody" class="zoom-body"></div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
const R = /*__RESULT__*/null;
const A = /*__ASSETS__*/null;

const lotsById = Object.fromEntries((R.lots || []).map(l => [l.lot_id, l]));
const surfById = Object.fromEntries((R.etape1_surfaces || []).map(s => [s.lot_id, s]));
const gen = R.etape4_generation || {};
const genIds = Object.keys(gen);
const singById = R.etape3_singularites || {};
const exclusById = Object.fromEntries((R.etape2_exclus || []).map(e => [e.lot_id, e]));
const temoins = R.lots_temoins || [];
const temoinId = (temoins[0] && temoins[0].lot_id) || genIds[0] || "B31";
const qLotObj = (R.etape1_surfaces || []).find(s => s.statut === "QUARANTAINE");
const qLotId = qLotObj ? qLotObj.lot_id : "B22";
const appel = R.etape2_prix_appel;
const appelOldId = appel ? appel.ancien_lot : ((R.etape2_exclus && R.etape2_exclus[0] && R.etape2_exclus[0].lot_id) || "A04");

const S = {
  step: 0,
  playing: 0,
  typing: false,
  skipTyping: false,
  lot: genIds[0] || "B31",
  vue: "portail",
  slide: 0,
  temoinValide: false,
  zoom: false,
  runId: 0,
  typed: {},
  tourScrolling: false,
  litTarget: null
};

const esc = s => String(s ?? "")
  .replace(/&/g, "&amp;")
  .replace(/</g, "&lt;")
  .replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

const fmtPrice = n => Number(n || 0).toLocaleString("fr-FR");
const fmtNum = n => Number(n).toLocaleString("fr-FR", { maximumFractionDigits: 2 });
const fmtDate = iso => new Date(iso).toLocaleDateString("fr-FR", { timeZone: "UTC" });
const fmtK = n => `${Math.round(Number(n || 0) / 1000)} k€`;
const sleep = ms => new Promise(res => setTimeout(res, ms));
const planURI = id => (A.plans && A.plans[id]) || "";

function planZonesForLot(lot) {
  const ext = /terrasse/i.test(lot.exterieur_type || "") ? [90, 100, 620, 115] : [90, 130, 620, 75];
  return [
    { t: "exterieur", r: ext },
    { t: "sejour_cuisine", r: [96, 221, 354, 310] },
    { t: "chambre_1", r: [450, 221, 254, 245] },
    { t: "chambre_2", r: [450, 466, 254, 253] },
    { t: "salle_de_bain_wc", r: [255, 531, 195, 188] },
    { t: "entree_degagement", r: [96, 531, 159, 118] },
    { t: "boussole", r: [745, 70, 140, 125] },
    { t: "cartouche_surface", r: [779, 483, 352, 86] }
  ];
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("is-show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("is-show"), 2600);
}

function stopTour() {
  S.litTarget = null;
  clearWires();
}

function clearWires() {
  const w = document.getElementById("wires");
  if (w) w.innerHTML = "";
  document.querySelectorAll(".pf.is-lit,.prest.is-lit,.src-row.is-lit,#planSvg .hl.is-on").forEach(el => {
    el.classList.remove("is-lit", "is-on");
  });
}

function expandSourceTargets(rawSources) {
  const planMap = {
    "MBI.exterieur_m2": "PLAN.exterieur",
    "MBI.exterieur_type": "PLAN.exterieur",
    "SING.PLUS_GRAND_EXTERIEUR": "PLAN.exterieur",
    "MBI.exposition": "PLAN.boussole",
    "SING.TRAVERSANT": "PLAN.boussole",
    "SING.COEUR_ILOT": "PLAN.exterieur",
    "SING.PLUS_GRANDE_SURFACE": "PLAN.sejour_cuisine",
    "MBI.surface_habitable_mbi": "PLAN.cartouche_surface"
  };
  const out = new Set(rawSources);
  rawSources.forEach(s => {
    if (planMap[s]) out.add(planMap[s]);
  });
  return Array.from(out);
}

function findSourceNodes(tokens) {
  const rows = [];
  document.querySelectorAll("#proofSources .src-row[data-src-keys]").forEach(row => {
    const keys = (row.getAttribute("data-src-keys") || "").split(",").filter(Boolean);
    if (tokens.some(t => keys.includes(t))) rows.push(row);
  });
  const rects = [];
  document.querySelectorAll("#planSvg .hl[data-zone]").forEach(rect => {
    const z = rect.getAttribute("data-zone");
    if (tokens.includes(`PLAN.${z}`)) rects.push(rect);
  });
  return { rows, rects };
}

function appendWireNodes(svg, x1, y1, x2, y2) {
  const ns = "http://www.w3.org/2000/svg";
  const dx = Math.max(40, Math.abs(x1 - x2) * 0.45);
  const path = document.createElementNS(ns, "path");
  path.setAttribute("d", `M ${x1.toFixed(1)} ${y1.toFixed(1)} C ${(x1 - dx).toFixed(1)} ${y1.toFixed(1)}, ${(x2 + dx).toFixed(1)} ${y2.toFixed(1)}, ${x2.toFixed(1)} ${y2.toFixed(1)}`);
  svg.appendChild(path);

  const c1 = document.createElementNS(ns, "circle");
  c1.setAttribute("cx", x1.toFixed(1));
  c1.setAttribute("cy", y1.toFixed(1));
  c1.setAttribute("r", "3.5");
  svg.appendChild(c1);

  const c2 = document.createElementNS(ns, "circle");
  c2.setAttribute("cx", x2.toFixed(1));
  c2.setAttribute("cy", y2.toFixed(1));
  c2.setAttribute("r", "3.5");
  svg.appendChild(c2);
}

function showProof(el) {
  if (!el || S.step < 4 || S.vue !== "nexity" || S.zoom || !gen[S.lot]) return;
  clearWires();
  const raw = (el.getAttribute("data-sources") || "").split(",").filter(Boolean);
  if (!raw.length) return;
  const rEl = el.getBoundingClientRect();
  const appRect = document.getElementById("app").getBoundingClientRect();
  if (rEl.bottom < appRect.top || rEl.top > appRect.bottom || rEl.width === 0) return;

  el.classList.add("is-lit");
  const x1 = rEl.left;
  const y1 = Math.min(Math.max(rEl.top + rEl.height / 2, appRect.top + 8), appRect.bottom - 8);

  const tokens = expandSourceTargets(raw);
  const { rows, rects } = findSourceNodes(tokens);
  const srcEl = document.getElementById("proofSources");
  let srcBox = srcEl.getBoundingClientRect();

  if (rows.length) {
    const r0 = rows[0].getBoundingClientRect();
    if (r0.top < srcBox.top + 6) {
      S.tourScrolling = true;
      srcEl.scrollTop += (r0.top - srcBox.top - 10);
      srcBox = srcEl.getBoundingClientRect();
      clearTimeout(showProof._st);
      showProof._st = setTimeout(() => { S.tourScrolling = false; }, 120);
    } else if (r0.bottom > srcBox.bottom - 6) {
      S.tourScrolling = true;
      srcEl.scrollTop += (r0.bottom - srcBox.bottom + 10);
      srcBox = srcEl.getBoundingClientRect();
      clearTimeout(showProof._st);
      showProof._st = setTimeout(() => { S.tourScrolling = false; }, 120);
    }
  }

  const w = document.getElementById("wires");
  w.setAttribute("viewBox", `0 0 ${window.innerWidth} ${window.innerHeight}`);
  w.setAttribute("width", String(window.innerWidth));
  w.setAttribute("height", String(window.innerHeight));

  rows.forEach(row => {
    row.classList.add("is-lit");
    const rr = row.getBoundingClientRect();
    const midY = rr.top + rr.height / 2;
    if (rr.width > 0 && midY >= srcBox.top + 8 && midY <= srcBox.bottom - 8) {
      appendWireNodes(w, x1, y1, rr.right, midY);
    }
  });
  rects.forEach(rect => {
    rect.classList.add("is-on");
    const rb = rect.getBoundingClientRect();
    if (rb.width > 0) {
      appendWireNodes(w, x1, y1, rb.left + rb.width / 2, rb.top + rb.height / 2);
    }
  });
}

async function runProofTour(runId) {
  if (S.step < 4 || S.vue !== "nexity" || S.zoom || !gen[S.lot]) return;
  const items = Array.from(document.querySelectorAll("#app .pf, #app .prest"));
  if (!items.length) return;
  for (let i = 0; i < Math.min(3, items.length); i++) {
    if (runId !== S.runId || S.step < 4 || S.vue !== "nexity" || S.zoom) return;
    const el = items[i];
    S.tourScrolling = true;
    el.scrollIntoView({ block: "nearest" });
    await sleep(60);
    S.tourScrolling = false;
    if (runId !== S.runId) return;
    showProof(el);
    await sleep(950);
  }
}

function animatePriceCount(fromVal, toVal, runId) {
  setTimeout(() => {
    if (runId !== S.runId) return;
    const t0 = performance.now();
    const dur = 700;
    function frame(now) {
      if (runId !== S.runId) return;
      const el = document.getElementById("sidePriceVal");
      if (!el) return;
      const p = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      const val = Math.round(fromVal + (toVal - fromVal) * eased);
      el.textContent = `${fmtPrice(val)} €`;
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }, 420);
}

function getWorkNotice(lot) {
  const id = lot.lot_id;
  const s1 = surfById[id];
  const isQuar = s1 && s1.statut === "QUARANTAINE";
  const isSold = lot.statut_mbi !== "DISPONIBLE";
  const prod = R.productivite;

  if (S.playing === 1) return { msg: "Audit géométrique des plans 2D vs flux MBI en cours...", btn: "" };
  if (S.playing === 2) return { msg: `Mise à jour du prix d'appel : ${appel.ancien_lot} vendu → bascule sur ${appel.nouveau_lot}.`, btn: "" };
  if (S.playing === 3) return { msg: `Calcul des singularités sur ${id} et sélection du lot témoin...`, btn: "" };

  if (S.step === 0) {
    return {
      msg: `Lot ${id} chargé depuis le flux MBI. Lancez le contrôle surfaces pour auditer les plans 2D.`,
      btn: ""
    };
  }
  if (isQuar && S.step >= 1) {
    return {
      msg: `Publication bloquée sur ${id} : écart de ${fmtNum(s1.ecart_m2)} m² (${fmtNum(s1.ecart_pct)} %) entre MBI (${fmtNum(s1.surface_mbi)} m²) et plan 2D (${fmtNum(s1.surface_plan)} m²).`,
      btn: ""
    };
  }
  if (isSold) {
    const ex = exclusById[id];
    const dStr = ex && ex.depuis ? fmtDate(ex.depuis) : "";
    return {
      msg: S.step >= 2 && appel
        ? `Lot ${id} exclu (vendu${dStr ? ` le ${dStr}` : ""}). Prix d'appel programme basculé sur ${appel.nouveau_lot} (${fmtPrice(appel.nouveau_prix)} €).`
        : `Lot ${id} marqué vendu dans le flux MBI${dStr ? ` (${dStr})` : ""}.`,
      btn: ""
    };
  }
  if (S.step === 1) {
    return { msg: `Surface ${id} conforme (${fmtNum(s1.surface_mbi)} m² MBI vs ${fmtNum(s1.surface_plan)} m² plan). Passez au prix d'appel.`, btn: "" };
  }
  if (S.step === 2) {
    return { msg: `Prix d'appel corrigé à ${fmtPrice(appel.nouveau_prix)} € (${appel.nouveau_lot}). Prêt pour l'analyse de singularités.`, btn: "" };
  }
  if (S.step === 3) {
    const nbS = (singById[id] || []).length;
    return { msg: `${nbS} singularités vérifiées sur le périmètre T3 (${R.etape3_perimetres.T3.nb_comparables} lots fiables). Prêt pour rédaction.`, btn: "" };
  }
  if (S.step === 4) {
    return { msg: `Fiche ${id} rédigée sans violation. Cliquez un point fort dans le mobile pour tracer ses preuves.`, btn: "" };
  }
  const btnLabel = S.temoinValide
    ? `Témoin validé · ${genIds.join(" + ")} prêts`
    : "Valider le lot témoin";
  const btnCls = S.temoinValide ? "btn-temoin is-done" : "btn-temoin";
  const gain = `${prod.lots_a_relire}/${prod.lots_generes} lot à relire · ${prod.minutes_relecture_temoin} vs ${prod.minutes_manuelles_par_lot * prod.lots_generes} min`;
  return {
    msg: S.temoinValide
      ? `Lot témoin ${temoinId} validé : publication autorisée pour ${genIds.join(" et ")}.`
      : `Relecture groupée sur le lot témoin ${temoinId} : une validation couvre ${genIds.join(" et ")}.`,
    btn: `<span class="notice-metric">${esc(gain)}</span><button id="btnTemoin" type="button" class="${btnCls}">${esc(btnLabel)}</button>`
  };
}

function parseFirstNum(str) {
  const m = String(str || "").match(/\d[\d\s\u202f\u00a0.,]*/);
  if (!m) return NaN;
  return parseFloat(m[0].replace(/[\s\u202f\u00a0]/g, "").replace(",", "."));
}

function renderSingularityBars(lot, sings) {
  const perim = R.etape3_perimetres && R.etape3_perimetres[lot.typologie];
  const scopeLabel = perim ? `sur ${perim.nb_comparables} T3 comparables reçus` : "périmètre vérifié";

  const forbiddenMap = {
    PLUS_GRAND_EXTERIEUR: "Le plus grand du programme",
    PLUS_GRANDE_SURFACE: "Le plus spacieux de la résidence",
    DERNIER_ETAGE: "Vue imprenable garantie",
    TRAVERSANT: "Luminosité maximale absolue",
    COEUR_ILOT: "Calme absolu garanti",
    PRIX_ACCES: "Meilleur prix de la ville",
    PRIX_M2: "Prix imbattable du secteur"
  };

  return sings.map(sg => {
    let barsHtml = "";
    if (sg.reference) {
      const vNum = parseFirstNum(sg.valeur);
      const rNum = parseFirstNum(sg.reference);
      if (Number.isFinite(vNum) && Number.isFinite(rNum) && Math.max(vNum, rNum) > 0) {
        const denom = Math.max(vNum, rNum);
        const wLot = Math.round((vNum / denom) * 100);
        const wRef = Math.round((rNum / denom) * 100);
        barsHtml = `
          <div class="sing-bar-track"><div class="sing-bar-fill" style="width:${wLot}%"></div></div>
          <div class="sing-bar-track is-ref"><div class="sing-bar-fill is-ref" style="width:${wRef}%"></div></div>
          <div class="sing-ref">Suivant : ${esc(sg.reference)}</div>
        `;
      }
    }

    const badPhrase = forbiddenMap[sg.code] || "Superlatif programme non borné";
    return `
      <div class="src-row" data-src-keys="SING.${esc(sg.code)}">
        <div class="sing-head">
          <span class="sing-lbl">${esc(sg.libelle)}</span>
          <span class="sing-val">${esc(sg.valeur)}</span>
        </div>
        ${barsHtml}
        <div class="sing-guard">
          <span class="struck-bad">${esc(badPhrase)}</span>
          <span class="scope-ok">${esc(scopeLabel)}</span>
        </div>
      </div>
    `;
  }).join("");
}

    const reason = s1 && s1.statut === "QUARANTAINE"
      ? `Lot ${id} bloqué en quarantaine : divergence de surface (${fmtNum(s1.surface_mbi)} m² MBI vs ${fmtNum(s1.surface_plan)} m² plan 2D).`
      : `Lot ${id} marqué ${lot.statut_mbi} dans le flux MBI : retiré de la publication.`;
    return `
      <div class="lp">
        <div class="lp-nav"><img src="${A.logoW}" alt="Nexity"><span class="lp-nav-tag">Lot ${esc(id)}</span></div>
        <div class="lp-blocked">
          <div class="lp-blocked-title">Aucune fiche générée</div>
          <div class="lp-blocked-txt">${esc(reason)}</div>
        </div>
      </div>
    `;
  }

  if (S.step < 4) {
    return `
      <div class="lp">
        <div class="lp-nav"><img src="${A.logoW}" alt="Nexity"><span class="lp-nav-tag">Lot ${esc(id)}</span></div>
        <div class="lp-blocked">
          <div class="lp-blocked-title">Fiche ${esc(id)} en attente de rédaction</div>
          <div class="lp-blocked-txt">Complétez les étapes Surfaces, Prix d'appel et Singularités puis passez à l'étape 4 (Rédaction) pour générer la page nexity.fr et ses fils de preuve.</div>
        </div>
      </div>
    `;
  }

  const f = g.fiche;
  const pfs = (f.points_forts || []).map((pf, idx) => `
    <div class="pf" data-pf="${idx}" data-sources="${esc((pf.sources || []).join(","))}" data-type-text="${esc(pf.texte)}">
      <div class="pf-txt">${esc(pf.texte)}</div>
      <span class="lp-src-chip">${esc((pf.sources || []).join(" · "))}</span>
    </div>
  `).join("");

  const prests = (f.prestations || []).map((pr, idx) => `
    <div class="prest" data-prest="${idx}" data-sources="${esc(pr.clause_id)}" data-type-text="${esc(pr.texte)}">
      <div class="prest-txt">${esc(pr.texte)}</div>
      <span class="lp-src-chip">${esc(pr.clause_id)}</span>
    </div>
  `).join("");

  const mentions = (g.mentions || []).map(m => `<div>${esc(m.texte)}</div>`).join("");

  return `
    <div class="lp">
      <div class="lp-nav">
        <img src="${A.logoW}" alt="Nexity">
        <span class="lp-nav-tag">Lot ${esc(id)} · ${esc(lot.typologie)}</span>
      </div>
      <div class="lp-media">
        <img id="lpSlideImg" src="${slideImg()}" alt="${esc(slideLabel())}">
        <div class="lp-slider-bar">
          <span id="lpSlideLbl">${esc(slideLabel())}</span>
          <input id="lpSlider" class="lp-slider" type="range" min="0" max="2" step="1" value="${S.slide}" aria-label="Choisir le visuel du lot">
        </div>
      </div>
      <div class="lp-body">
        <div class="lp-kicker">${esc(R.programme.nom)} · ${esc(R.programme.ville)}</div>
        <div class="lp-price">${fmtPrice(lot.prix_ttc)} €</div>
        <h1 class="lp-h1" data-type-text="${esc(f.titre)}">${esc(f.titre)}</h1>
        <p class="lp-accroche" data-type-text="${esc(f.accroche)}">${esc(f.accroche)}</p>
        <div class="lp-sec-title">Points forts sourcés</div>
        ${pfs}
        <div class="lp-sec-title">Prestations notice descriptive</div>
        ${prests}
        <div class="mentions">${mentions}</div>
      </div>
    </div>
  `;
}

function bindPhoneHandlers() {
  const slider = document.getElementById("lpSlider");
  if (slider) {
    const onSlide = e => {
      S.slide = Number(e.target.value) || 0;
      const img = document.getElementById("lpSlideImg");
      const lbl = document.getElementById("lpSlideLbl");
      if (img) img.src = slideImg();
      if (lbl) lbl.textContent = slideLabel();
    };
    slider.addEventListener("input", onSlide);
    slider.addEventListener("change", e => {
      onSlide(e);
      e.target.blur();
    });
  }

  document.querySelectorAll("#app .pf, #app .prest").forEach(el => {
    el.addEventListener("mouseenter", () => showProof(el));
    el.addEventListener("click", ev => {
      ev.stopPropagation();
      S.litTarget = el;
      showProof(el);
    });
  });
}

function renderPhone() {
  renderPhoneControls();
  const lot = lotsById[S.lot] || R.lots[0];
  const app = document.getElementById("app");
  clearWires();
  app.innerHTML = S.vue === "portail" ? renderPhonePortal(lot) : renderPhoneNexityStatic(lot);
  bindPhoneHandlers();
}

async function runTypingForCurrentLot(runId) {
  const id = S.lot;
  if (!gen[id] || S.step < 4 || S.vue !== "nexity" || S.typed[id]) return;
  const targets = Array.from(document.querySelectorAll("#app [data-type-text]"));
  if (!targets.length) {
    S.typed[id] = true;
    return;
  }

  const fullTexts = targets.map(el => el.getAttribute("data-type-text") || "");
  const domSlots = targets.map(el => {
    const slot = el.classList.contains("pf") ? el.querySelector(".pf-txt")
      : el.classList.contains("prest") ? el.querySelector(".prest-txt")
      : el;
    slot.textContent = "";
    return slot;
  });

  const totalChars = Math.max(1, fullTexts.reduce((a, b) => a + b.length, 0));
  const perCharMs = Math.min(14, Math.max(4, Math.floor(4200 / totalChars)));
  S.typing = true;
  S.skipTyping = false;

  const finishEarly = () => { S.skipTyping = true; };
  const appEl = document.getElementById("app");
  appEl.addEventListener("click", finishEarly, { once: true });

  const caret = document.createElement("span");
  caret.className = "caret";

  for (let t = 0; t < targets.length; t++) {
    const txt = fullTexts[t];
    const slot = domSlots[t];
    if (S.skipTyping || runId !== S.runId) break;
    slot.appendChild(caret);
    for (let c = 1; c <= txt.length; c++) {
      if (S.skipTyping || runId !== S.runId) break;
      slot.textContent = txt.slice(0, c);
      slot.appendChild(caret);
      if (c % 2 === 0 || perCharMs >= 8) await sleep(perCharMs);
    }
  }
  if (caret.parentNode) caret.parentNode.removeChild(caret);
  S.typing = false;
  S.skipTyping = false;

  if (runId !== S.runId) return;
  domSlots.forEach((slot, idx) => { slot.textContent = fullTexts[idx]; });
  S.typed[id] = true;
  await runProofTour(runId);
}

function renderRail() {
  const nbQuar = (R.etape1_surfaces || []).filter(s => s.statut === "QUARANTAINE").length;
  const totalSing = Object.values(singById).reduce((acc, arr) => acc + (arr ? arr.length : 0), 0);
  const s1Sub = S.step >= 1 ? `${nbQuar} quarantaine · ${qLotId}` : "En attente";
  const s2Sub = S.step >= 2 && appel
    ? `${appel.ancien_lot} → ${appel.nouveau_lot} (${fmtK(appel.nouveau_prix)})`
    : "En attente";
  const s3Sub = S.step >= 3 ? `${totalSing} preuves · ${temoins.length} témoin` : "En attente";
  const s4Sub = S.step >= 4 ? `${genIds.length} fiches · 0 violation` : "En attente";
  const s5Sub = S.step >= 5
    ? (S.temoinValide ? "Validé · prêt" : `Relecture ${temoinId}`)
    : "En attente";

  const steps = [
    { n: 1, l1: "1 · Surfaces & plans", l2: s1Sub },
    { n: 2, l1: "2 · Prix & exclus", l2: s2Sub },
    { n: 3, l1: "3 · Singularités", l2: s3Sub },
    { n: 4, l1: "4 · Rédaction", l2: s4Sub },
    { n: 5, l1: "5 · Validation", l2: s5Sub }
  ];

  const stepsHtml = steps.map(st => {
    const done = S.step >= st.n;
    const curr = S.playing === st.n || (S.playing === 0 && S.step === st.n);
    const cls = curr ? " is-curr" : (done ? " is-done" : " is-pend");
    return `
      <button type="button" class="rail-step${cls}" data-rail-step="${st.n}" ${done ? "" : "aria-disabled=\"true\""}>
        <div class="rs-l1">${esc(st.l1)}</div>
        <div class="rs-l2">${esc(st.l2)}</div>
      </button>
    `;
  }).join("");

  let nextTxt = "Démarrer : Contrôle surfaces";
  if (S.playing === 1) nextTxt = "Scan surfaces...";
  else if (S.playing === 2) nextTxt = "Mise à jour prix...";
  else if (S.playing === 3) nextTxt = "Analyse singularités...";
  else if (S.step === 1) nextTxt = "Mettre à jour prix d'appel";
  else if (S.step === 2) nextTxt = "Analyser singularités";
  else if (S.step === 3) nextTxt = "Rédiger les fiches";
  else if (S.step === 4) nextTxt = "Ouvrir validation témoin";
  else if (S.step === 5 && !S.temoinValide) nextTxt = "Valider le lot témoin";
  else if (S.step === 5 && S.temoinValide) nextTxt = "Cycle complet · Reset";

  document.getElementById("rail").innerHTML = `
    <div class="rail-steps">${stepsHtml}</div>
    <div class="rail-actions">
      <button id="btnAuto" type="button" class="btn-auto">${S.playing ? "en cours..." : "tout dérouler"}</button>
      <button id="btnNext" type="button" class="btn-next">${esc(nextTxt)}</button>
    </div>
  `;
}

function render() {
  const lot = lotsById[S.lot] || R.lots[0];
  renderTopbar();
  renderSidebar();
  renderWorkHeadAndNotice(lot);
  renderProofPlan(lot);
  renderProofSources(lot);
  renderPhone();
  renderRail();
}

function openZoom() {
  const lot = lotsById[S.lot];
  if (!lot || !lot.plan_2d_fichier) return;
  S.zoom = true;
  clearWires();
  document.getElementById("zoomTitle").textContent = `Plan 2D · Lot ${lot.lot_id} (${lot.plan_2d_fichier})`;
  document.getElementById("zoomBody").innerHTML = `<img src="${planURI(lot.lot_id)}" alt="Plan ${esc(lot.lot_id)}">`;
  document.getElementById("zoomModal").classList.add("is-open");
}

function closeZoom() {
  S.zoom = false;
  document.getElementById("zoomModal").classList.remove("is-open");
}

function focusRailStep(n) {
  if (S.step < n || S.playing !== 0) return;
  S.runId++;
  stopTour();
  if (n === 1) S.lot = qLotId;
  else if (n === 2) S.lot = appelOldId;
  else if (n === 3) S.lot = temoinId;
  else if (n === 4 || n === 5) {
    S.lot = temoinId;
    S.vue = "nexity";
    S.typed[S.lot] = true;
  }
  render();
  if (n === 4 && S.vue === "nexity") runProofTour(S.runId);
}

async function avancer(customId) {
  const id = customId ?? ++S.runId;
  stopTour();

  if (S.step === 5 && !S.temoinValide) {
    S.temoinValide = true;
    render();
    toast(`Lot témoin ${temoinId} validé : ${genIds.join(" et ")} prêts à publier`);
    return;
  }
  if (S.step === 5 && S.temoinValide) {
    reset();
    return;
  }

  if (S.step === 0) {
    S.playing = 1;
    render();
    await sleep(2000);
    if (id !== S.runId) return;
    S.playing = 0;
    S.step = 1;
    S.lot = qLotId;
    render();
    return;
  }

  if (S.step === 1) {
    S.playing = 2;
    render();
    if (appel) animatePriceCount(appel.ancien_prix, appel.nouveau_prix, id);
    await sleep(1400);
    if (id !== S.runId) return;
    S.playing = 0;
    S.step = 2;
    S.lot = appelOldId;
    render();
    return;
  }

  if (S.step === 2) {
    S.lot = temoinId;
    S.playing = 3;
    render();
    await sleep(1200);
    if (id !== S.runId) return;
    S.playing = 0;
    S.step = 3;
    render();
    return;
  }

  if (S.step === 3) {
    S.step = 4;
    S.lot = temoinId;
    S.vue = "nexity";
    S.typed[S.lot] = false;
    render();
    await runTypingForCurrentLot(id);
    return;
  }

  if (S.step === 4) {
    S.step = 5;
    S.lot = temoinId;
    S.vue = "nexity";
    S.typed[S.lot] = true;
    render();
  }
}

async function toutDerouler() {
  const id = ++S.runId;
  if (S.step === 5 && S.temoinValide) reset();
  while (S.step < 5) {
    if (id !== S.runId) return;
    await avancer(id);
    if (id !== S.runId) return;
    if (S.step < 5) await sleep(900);
  }
}

function reculer() {
  S.runId++;
  S.playing = 0;
  stopTour();
  if (S.temoinValide) {
    S.temoinValide = false;
    render();
    return;
  }
  if (S.step > 0) {
    S.step--;
    if (S.step === 1) S.lot = qLotId;
    else if (S.step === 2) S.lot = appelOldId;
    else S.lot = temoinId;
    if (S.step < 4 && S.vue === "nexity") S.vue = "portail";
    render();
  }
}

function reset() {
  S.runId++;
  S.step = 0;
  S.playing = 0;
  S.typing = false;
  S.skipTyping = false;
  S.lot = genIds[0] || "B31";
  S.vue = "portail";
  S.slide = 0;
  S.temoinValide = false;
  S.typed = {};
  closeZoom();
  stopTour();
  render();
}

function selectLot(id) {
  if (!lotsById[id]) return;
  S.runId++;
  S.playing = 0;
  S.typing = false;
  S.skipTyping = false;
  stopTour();
  S.lot = id;
  if (S.step >= 4 && S.vue === "nexity" && gen[id]) {
    S.typed[id] = true;
  }
  render();
}

function bindEvents() {
  document.getElementById("btnReset").addEventListener("click", reset);
  document.getElementById("zoomClose").addEventListener("click", closeZoom);
  document.getElementById("zoomModal").addEventListener("click", e => {
    if (e.target.id === "zoomModal") closeZoom();
  });

  document.getElementById("side").addEventListener("click", e => {
    const btn = e.target.closest("[data-select-lot]");
    if (btn) selectLot(btn.getAttribute("data-select-lot"));
  });

  document.getElementById("work").addEventListener("click", e => {
    if (e.target.closest("#btnZoomPlan")) openZoom();
    if (e.target.closest("#btnTemoin")) {
      S.temoinValide = !S.temoinValide;
      render();
      if (S.temoinValide) toast(`Lot témoin ${temoinId} validé`);
    }
  });

  document.getElementById("segVue").addEventListener("click", e => {
    const btn = e.target.closest("[data-vue]");
    if (!btn) return;
    S.runId++;
    S.typing = false;
    S.skipTyping = false;
    stopTour();
    S.vue = btn.getAttribute("data-vue");
    if (S.vue === "nexity" && S.step >= 4 && gen[S.lot]) S.typed[S.lot] = true;
    render();
  });

  document.getElementById("segLot").addEventListener("click", e => {
    const btn = e.target.closest("[data-lot-btn]");
    if (btn) selectLot(btn.getAttribute("data-lot-btn"));
  });

  document.getElementById("rail").addEventListener("click", e => {
    if (e.target.closest("#btnNext")) {
      if (S.typing) { S.skipTyping = true; return; }
      if (S.playing === 0) avancer();
      return;
    }
    if (e.target.closest("#btnAuto")) {
      if (S.playing === 0 && !S.typing) toutDerouler();
      return;
    }
    const stepBtn = e.target.closest("[data-rail-step]");
    if (stepBtn) focusRailStep(Number(stepBtn.getAttribute("data-rail-step")));
  });

  document.getElementById("app").addEventListener("scroll", () => {
    if (!S.tourScrolling) clearWires();
  });
  document.getElementById("proofSources").addEventListener("scroll", () => {
    if (!S.tourScrolling) clearWires();
  });
  window.addEventListener("resize", () => clearWires());

  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = e.target && e.target.matches
      ? e.target.matches("input:not([type='range']), textarea, select, [contenteditable='true']")
      : false;
    if (tag) return;

    if (e.target && e.target.id === "lpSlider" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
      return;
    }

    const k = e.key.toLowerCase();
    if (k === "escape") {
      if (S.zoom) {
        e.preventDefault();
        closeZoom();
      }
      return;
    }
    if (e.code === "Space" || e.key === "ArrowRight") {
      e.preventDefault();
      if (S.zoom) { closeZoom(); return; }
      if (S.typing) { S.skipTyping = true; return; }
      if (S.playing === 0) avancer();
      return;
    }
    if (e.key === "ArrowLeft") {
      e.preventDefault();
      reculer();
      return;
    }
    if (k === "r") {
      e.preventDefault();
      reset();
      return;
    }
    if (k === "p") {
      e.preventDefault();
      S.runId++;
      stopTour();
      S.vue = S.vue === "portail" ? "nexity" : "portail";
      if (S.vue === "nexity" && S.step >= 4 && gen[S.lot]) S.typed[S.lot] = true;
      render();
      return;
    }
    if (k === "l") {
      e.preventDefault();
      if (genIds.length) {
        const idx = genIds.indexOf(S.lot);
        selectLot(genIds[(idx + 1) % genIds.length]);
      }
      return;
    }
    if (k === "z") {
      e.preventDefault();
      if (S.zoom) closeZoom();
      else openZoom();
      return;
    }
    if (k === "t") {
      e.preventDefault();
      if (S.step >= 4 && gen[S.lot] && !S.zoom) {
        S.vue = "nexity";
        S.typed[S.lot] = true;
        render();
        runProofTour(++S.runId);
      }
    }
  });
}

render();
bindEvents();
</script>
</body>
</html>
