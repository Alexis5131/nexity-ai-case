:root {
  /* === IDENTITÉ OFFICIELLE "NEW NEXITY" (W Conran Design 2025) === */
  --nexity-red-primary: #FF002D;      /* Rouge vif logotype libéré (échantillonné logo officiel) */
  --nexity-red-banner: #EB002B;       /* Rouge bandeau & accents éditoriaux nexity.fr */
  --nexity-red-soft: #FFF0F3;         /* Fond léger badges & surlignages Nexity */
  --nexity-jet-black: #000000;        /* Boutons CTA principaux pill ("Rechercher", "Être rappelé") */
  --nexity-obsidian: #111315;         /* Titres H1/H2 haute lisibilité */

  /* === PALETTE "ARCHITECTURE & BÂTIMENT MINÉRAL" (Réassurance VEFA) === */
  --arch-limestone: #FAF8F5;          /* Pierre de Lutèce / Fond principal chaleureux anti-clinique */
  --arch-sandstone: #F2EFE9;          /* Calcaire sablé / Cartes secondaires & plans cotés */
  --arch-oak-border: #E2DCD3;         /* Menuiserie chêne clair / Filets architecturaux */
  --arch-slate-text: #475467;         /* Gris ardoise / Texte courant et notices */
  --arch-blueprint-blue: #0284C7;     /* Bleu cotation architecte & baies vitrées */

  /* === COULEURS SÉMANTIQUES GARDE-FOUS IA (Démo B2 / B3) === */
  --guard-quarantine-bg: #FEF3F2;     /* Rouge quarantaine anomalie surface MBI != Plan */
  --guard-quarantine-fg: #B42318;
  --guard-legal-warn-bg: #FFFAEB;     /* Orange alerte prix "à partir de" caduc */
  --guard-legal-warn-fg: #B54708;
  --guard-verified-bg: #ECFDF3;       /* Vert mention juridique verrouillée & similarité < 30% */
  --guard-verified-fg: #027A48;

  /* === TYPOGRAPHIE & RAYONS === */
  --font-sans: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace; /* Cotes m², réf. lots, pages notice */
  --radius-pill: 9999px;              /* Signature boutons CTA nexity.fr */
  --radius-card: 16px;                /* Cartes programmes & lots */
  --radius-plan: 10px;                /* Cadres plans 2D & cartouches */
  --shadow-floating: 0 12px 32px -8px rgba(17, 19, 21, 0.08);
}


*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  background: var(--arch-limestone);
  color: var(--nexity-obsidian);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: 0;
  background: transparent;
  color: inherit;
  padding: 0;
}

.mono { font-family: var(--font-mono); }

.studio {
  display: grid;
  grid-template-rows: 48px minmax(0, 1fr) 56px;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  background: var(--arch-limestone);
}

/* TOPBAR (48px) */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 18px;
  background: #ffffff;
  border-bottom: 1px solid var(--arch-oak-border);
  z-index: 20;
}

.tb-left {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

.tb-logo {
  height: 18px;
  width: auto;
  display: block;
}

.tb-sep {
  width: 1px;
  height: 18px;
  background: var(--arch-oak-border);
}

.tb-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--nexity-obsidian);
  white-space: nowrap;
}

.tb-ref {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--arch-slate-text);
  background: var(--arch-sandstone);
  border: 1px solid var(--arch-oak-border);
  border-radius: 4px;
  padding: 2px 7px;
  white-space: nowrap;
}

.tb-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.tb-chip {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--arch-slate-text);
  padding: 3px 9px;
  border: 1px solid var(--arch-oak-border);
  border-radius: var(--radius-pill);
  background: var(--arch-limestone);
  white-space: nowrap;
}

.tb-keys {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--arch-slate-text);
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.tb-btn {
  font-size: 12px;
  font-weight: 600;
  padding: 5px 11px;
  border: 1px solid var(--arch-oak-border);
  border-radius: 6px;
  background: #ffffff;
  color: var(--nexity-obsidian);
  transition: background-color 140ms ease, border-color 140ms ease;
}

.tb-btn:hover {
  background: var(--arch-sandstone);
  border-color: var(--nexity-obsidian);
}

/* MAIN 3-COLUMN WORKSPACE */
.main {
  display: grid;
  grid-template-columns: 278px minmax(0, 1fr) clamp(320px, 27vw, 404px);
  min-height: 0;
  overflow: hidden;
  background: var(--arch-limestone);
}

/* COL 1 : SIDEBAR FLUX MBI */
#side {
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  background: #ffffff;
  border-right: 1px solid var(--arch-oak-border);
}

.prog-head {
  border-bottom: 1px solid var(--arch-oak-border);
}

.prog-photo-wrap {
  position: relative;
  height: 84px;
  overflow: hidden;
  background: var(--arch-sandstone);
}

.prog-photo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.prog-zone {
  position: absolute;
  top: 7px;
  right: 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(17, 19, 21, 0.84);
  color: #ffffff;
}

.prog-info {
  padding: 10px 14px 11px;
}

.prog-name {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.2;
  color: var(--nexity-obsidian);
}

.prog-meta {
  margin-top: 3px;
  font-size: 11px;
  color: var(--arch-slate-text);
}

.price-box {
  padding: 10px 14px;
  background: var(--arch-limestone);
  border-bottom: 1px solid var(--arch-oak-border);
}

.price-lbl {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--arch-slate-text);
}

.price-row {
  margin-top: 4px;
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}

.price-old {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--guard-quarantine-fg);
  text-decoration: line-through;
}

.price-val {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--nexity-obsidian);
}

.price-sub {
  margin-top: 3px;
  font-size: 11px;
  color: var(--arch-slate-text);
}

.flux-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 9px 14px 7px;
  border-bottom: 1px solid var(--arch-oak-border);
  background: #ffffff;
}

.flux-title {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--nexity-obsidian);
  white-space: nowrap;
  flex-shrink: 0;
}

.flux-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--guard-legal-warn-bg);
  color: var(--guard-legal-warn-fg);
}

.lot-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 6px 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.lot-row {
  width: 100%;
  text-align: left;
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 6px 7px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: #ffffff;
  transition: background-color 130ms ease, border-color 130ms ease;
}

.lot-row:hover {
  background: var(--arch-limestone);
  border-color: var(--arch-oak-border);
}

.lot-row.is-active {
  background: var(--nexity-obsidian);
  border-color: var(--nexity-obsidian);
  color: #ffffff;
}

.lot-thumb {
  position: relative;
  width: 46px;
  height: 32px;
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid var(--arch-oak-border);
  background: var(--arch-sandstone);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.lot-row.is-active .lot-thumb {
  border-color: rgba(255, 255, 255, 0.28);
}

.lot-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.lot-thumb-empty {
  font-family: var(--font-mono);
  font-size: 9px;
  text-align: center;
  line-height: 1.15;
  color: var(--arch-slate-text);
  padding: 2px;
}

.lot-main {
  min-width: 0;
}

.lot-id {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 800;
  line-height: 1.2;
}

.lot-sub {
  font-size: 10px;
  color: var(--arch-slate-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.lot-row.is-active .lot-sub {
  color: rgba(255, 255, 255, 0.72);
}

.lot-tag {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  padding: 2px 5px;
  border-radius: 4px;
  white-space: nowrap;
}

.tag-ok { background: var(--guard-verified-bg); color: var(--guard-verified-fg); }
.tag-quar { background: var(--guard-quarantine-bg); color: var(--guard-quarantine-fg); }
.tag-sold { background: var(--arch-sandstone); color: var(--arch-slate-text); }
.tag-temoin { background: var(--nexity-red-primary); color: #ffffff; }
.tag-wait { background: var(--arch-limestone); color: var(--arch-slate-text); border: 1px solid var(--arch-oak-border); }

.lot-row.is-active .tag-wait {
  background: rgba(255, 255, 255, 0.16);
  color: #ffffff;
  border-color: rgba(255, 255, 255, 0.25);
}

.lot-row.is-active .tag-sold {
  background: rgba(255, 255, 255, 0.18);
  color: #ffffff;
}

/* Scan line overlay during step 1 */
@keyframes scanSweep {
  0% { top: 0%; opacity: 0.95; }
  50% { top: calc(100% - 2px); opacity: 1; }
  100% { top: 0%; opacity: 0.95; }
}

.scan-line {
  position: absolute;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--nexity-red-primary);
  pointer-events: none;
  animation: scanSweep 1.1s linear infinite;
  z-index: 4;
}

.scan-line.is-tall {
  height: 3px;
}

/* COL 2 : WORKSPACE LOT DOSSIER */
#work {
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  background: var(--arch-limestone);
  border-right: 1px solid var(--arch-oak-border);
}

.work-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 16px;
  background: #ffffff;
  border-bottom: 1px solid var(--arch-oak-border);
}

.work-title-wrap {
  display: flex;
  align-items: baseline;
  gap: 12px;
  min-width: 0;
  flex-wrap: nowrap;
}

.work-lot {

  font-size: 20px;
  font-weight: 800;

}

.work-specs {

.work-status {

}

.st-quar { background: var(--guard-quarantine-bg); color: var(--guard-quarantine-fg); border: 1px solid rgba(180, 35, 24, 0.25); }
.st-sold { background: var(--arch-sandstone); color: var(--arch-slate-text); border: 1px solid var(--arch-oak-border); }
.st-temoin { background: var(--nexity-red-soft); color: var(--nexity-red-banner); border: 1px solid rgba(255, 0, 45, 0.28); }
.st-ok { background: var(--guard-verified-bg); color: var(--guard-verified-fg); border: 1px solid rgba(2, 122, 72, 0.22); }

#notice {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 12px;
  padding: 8px 16px;

  border-bottom: 1px solid var(--arch-oak-border);
  min-height: 36px;
}

.notice-msg {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12px;
  color: var(--nexity-obsidian);
  flex: 1 1 240px;
  min-width: 0;
}

.sq-red {
  width: 7px;
  height: 7px;
  background: var(--nexity-red-primary);
  flex-shrink: 0;
}

.notice-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  margin-left: auto;
}

.notice-metric {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--arch-slate-text);
}

.btn-temoin {
  font-size: 12px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: var(--radius-pill);
  background: var(--nexity-red-primary);
  color: #ffffff;
  white-space: nowrap;
  transition: background-color 140ms ease;
}

.btn-temoin:hover { background: var(--nexity-red-banner); }

.btn-temoin.is-done {
  background: var(--guard-verified-bg);
  color: var(--guard-verified-fg);
  border: 1px solid rgba(2, 122, 72, 0.3);
}

.work-body {
  display: grid;
  grid-template-columns: 62fr 38fr;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

/* LEFT WORK PANEL: 2D PLAN & SURFACES */
#proofPlan {

.panel-kicker {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--nexity-obsidian);
  white-space: nowrap;
  flex-shrink: 0;
}

.panel-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--arch-slate-text);
  overflow: hidden;
  text-overflow: ellipsis;

}

.plan-zoom-btn {
  font-family: var(--font-mono);

  font-weight: 600;

  border: 1px solid var(--arch-oak-border);

  display: flex;
  align-items: center;
  justify-content: center;
}

.plan-box {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.plan-box img {
  max-width: 100%;
  max-height: 100%;

}

#planSvg {

}

#planSvg .hl {

}

#planSvg .hl.is-on {
  fill: rgba(255, 0, 45, 0.16);

}

.quar-stamp {

}

.plan-empty {

}

.plan-empty-title {
  font-size: 14px;
  font-weight: 700;

}

.plan-empty-sub {

}

.surf-strip {

}

}

.surf-cell {

}

.surf-k {

  font-size: 10px;
  text-transform: uppercase;
  color: var(--arch-slate-text);
}

.surf-v {
  margin-top: 1px;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--nexity-obsidian);
}

.surf-v.is-err { color: var(--guard-quarantine-fg); }

.crop-wrap {

.src-block {

.sing-head {

.struck-bad {

}

.lp-h1 {
  margin: 4px 0 0;
  font-size: 17px;
  font-weight: 800;
  line-height: 1.25;
  letter-spacing: -0.015em;
  color: var(--nexity-obsidian);
}

.lp-accroche {
  margin-top: 8px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--arch-slate-text);
}

.lp-sec-title {
  margin: 14px 0 7px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--arch-slate-text);
}

.pf, .prest {
  padding: 8px 10px;
  margin-bottom: 6px;
  border: 1px solid var(--arch-oak-border);
  border-radius: 6px;
  background: var(--arch-limestone);
  font-size: 12px;
  line-height: 1.42;
  cursor: pointer;
  transition: border-color 120ms ease, background-color 120ms ease;
}

.pf:hover, .prest:hover, .pf.is-lit, .prest.is-lit {
  border-color: var(--nexity-red-primary);
  background: var(--nexity-red-soft);
}

.lp-src-chip {
  display: inline-block;
  margin-top: 4px;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--arch-slate-text);
}

.mentions {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--arch-oak-border);
  font-size: 10px;
  line-height: 1.4;
  color: var(--arch-slate-text);
}

.lp-blocked {
  margin: 18px 14px;
  padding: 16px;
  border: 1px solid var(--arch-oak-border);
  border-radius: 8px;
  background: var(--arch-limestone);
}

.lp-blocked-title {
  font-size: 14px;
  font-weight: 800;
  color: var(--nexity-obsidian);
}

.lp-blocked-txt {
  margin-top: 6px;
  font-size: 12px;
  color: var(--arch-slate-text);
  line-height: 1.45;
}

@keyframes blinkCaret {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

.caret {
  display: inline-block;
  width: 2px;
  height: 1em;
  vertical-align: -2px;
  background: var(--nexity-red-primary);
  margin-left: 2px;
  animation: blinkCaret 0.7s step-end infinite;
}

/* BOTTOM PIPELINE RAIL (56px) */
#rail {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 16px;
  background: #ffffff;
  border-top: 1px solid var(--arch-oak-border);
  z-index: 20;
}

.rail-steps {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
  flex: 1;
  min-width: 0;
}

.rail-step {
  text-align: left;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid var(--arch-oak-border);
  background: var(--arch-limestone);
  min-width: 0;
  transition: background-color 130ms ease, border-color 130ms ease;
}

.rail-step.is-done {
  background: #ffffff;
  border-color: var(--nexity-obsidian);
}

.rail-step.is-curr {
  background: var(--nexity-obsidian);
  border-color: var(--nexity-obsidian);
  color: #ffffff;
}

.rail-step.is-pend {
  opacity: 0.62;
  cursor: default;
}

.rs-l1 {
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rs-l2 {
  margin-top: 1px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--arch-slate-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rail-step.is-curr .rs-l2 {
  color: rgba(255, 255, 255, 0.76);
}

.rail-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.btn-next {
  font-size: 12px;
  font-weight: 700;
  padding: 8px 16px;
  border-radius: var(--radius-pill);
  background: var(--nexity-red-primary);
  color: #ffffff;
  white-space: nowrap;
  transition: background-color 130ms ease;
}

.btn-next:hover { background: var(--nexity-red-banner); }

.btn-auto {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  padding: 7px 12px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--arch-oak-border);
  background: #ffffff;
  color: var(--nexity-obsidian);
  white-space: nowrap;
}

.btn-auto:hover {
  background: var(--arch-sandstone);
  border-color: var(--nexity-obsidian);
}

/* SVG PROOF WIRES OVERLAY */
#wires {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 40;
  overflow: visible;
}

#wires path {
  fill: none;
  stroke: #FF002D;
  stroke-width: 2;
  stroke-linecap: round;
}

#wires circle {
  fill: #FF002D;
}

/* ZOOM MODAL */
.zoom-modal {
  position: fixed;
  inset: 0;
  background: rgba(17, 19, 21, 0.86);
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 28px;
}

.zoom-modal.is-open { display: flex; }

.zoom-card {
  position: relative;
  width: min(1040px, 92vw);
  height: min(760px, 88vh);
  background: #ffffff;
  border-radius: 10px;
  border: 1px solid var(--arch-oak-border);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.zoom-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.zoom-body {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--arch-limestone);
  border: 1px solid var(--arch-oak-border);
  border-radius: 6px;
}

.zoom-body img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 66px;
  right: 18px;
  transform: translateY(10px);
  background: var(--nexity-obsidian);
  color: #ffffff;
  font-size: 12px;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: var(--radius-pill);
  opacity: 0;
  pointer-events: none;
  z-index: 60;
  transition: opacity 150ms ease, transform 150ms ease;
}

.toast.is-show {
  opacity: 1;
  transform: translateY(0);
}

  if (w) w.innerHTML = "";
  document.querySelectorAll(".pf.is-lit,.prest.is-lit,.src-row.is-lit,#planSvg .hl.is-on").forEach(el => {

  });

function expandSourceTargets(rawSources) {
  const planMap = {
    "MBI.exterieur_m2": "PLAN.exterieur",
    "MBI.exterieur_type": "PLAN.exterieur",
    "SING.PLUS_GRAND_EXTERIEUR": "PLAN.exterieur",
    "MBI.exposition": "PLAN.boussole",
    "SING.TRAVERSANT": "PLAN.boussole",
    "SING.COEUR_ILOT": "PLAN.exterieur",
    "SING.PLUS_GRANDE_SURFACE": "PLAN.sejour_cuisine",
    "MBI.surface_habitable_mbi": "PLAN.cartouche_surface"
  };
  const out = new Set(rawSources);
  rawSources.forEach(s => {
    if (planMap[s]) out.add(planMap[s]);
  });
  return Array.from(out);
}

function findSourceNodes(tokens) {
  const rows = [];
  document.querySelectorAll("#proofSources .src-row[data-src-keys]").forEach(row => {
    const keys = (row.getAttribute("data-src-keys") || "").split(",").filter(Boolean);
    if (tokens.some(t => keys.includes(t))) rows.push(row);
  });
  const rects = [];
  document.querySelectorAll("#planSvg .hl[data-zone]").forEach(rect => {
    const z = rect.getAttribute("data-zone");
    if (tokens.includes(`PLAN.${z}`)) rects.push(rect);
  });
  return { rows, rects };
}

function appendWireNodes(svg, x1, y1, x2, y2) {
  const ns = "http://www.w3.org/2000/svg";
  const dx = Math.max(40, Math.abs(x1 - x2) * 0.45);
  const path = document.createElementNS(ns, "path");
  path.setAttribute("d", `M ${x1.toFixed(1)} ${y1.toFixed(1)} C ${(x1 - dx).toFixed(1)} ${y1.toFixed(1)}, ${(x2 + dx).toFixed(1)} ${y2.toFixed(1)}, ${x2.toFixed(1)} ${y2.toFixed(1)}`);
  svg.appendChild(path);

  const c1 = document.createElementNS(ns, "circle");
  c1.setAttribute("cx", x1.toFixed(1));
  c1.setAttribute("cy", y1.toFixed(1));
  c1.setAttribute("r", "3.5");
  svg.appendChild(c1);

  const c2 = document.createElementNS(ns, "circle");
  c2.setAttribute("cx", x2.toFixed(1));
  c2.setAttribute("cy", y2.toFixed(1));
  c2.setAttribute("r", "3.5");
  svg.appendChild(c2);
}

function showProof(el) {
  if (!el || S.step < 4 || S.vue !== "nexity" || S.zoom || !gen[S.lot]) return;
  clearWires();
  const raw = (el.getAttribute("data-sources") || "").split(",").filter(Boolean);
  if (!raw.length) return;
  const rEl = el.getBoundingClientRect();
  const appRect = document.getElementById("app").getBoundingClientRect();
  if (rEl.bottom < appRect.top || rEl.top > appRect.bottom || rEl.width === 0) return;

  el.classList.add("is-lit");
  const x1 = rEl.left;
  const y1 = Math.min(Math.max(rEl.top + rEl.height / 2, appRect.top + 8), appRect.bottom - 8);

  const tokens = expandSourceTargets(raw);
  const { rows, rects } = findSourceNodes(tokens);
  const srcEl = document.getElementById("proofSources");
  let srcBox = srcEl.getBoundingClientRect();

  if (rows.length) {
    const r0 = rows[0].getBoundingClientRect();
    if (r0.top < srcBox.top + 6) {
      S.tourScrolling = true;
      srcEl.scrollTop += (r0.top - srcBox.top - 10);
      srcBox = srcEl.getBoundingClientRect();
      clearTimeout(showProof._st);
      showProof._st = setTimeout(() => { S.tourScrolling = false; }, 120);
    } else if (r0.bottom > srcBox.bottom - 6) {
      S.tourScrolling = true;
      srcEl.scrollTop += (r0.bottom - srcBox.bottom + 10);
      srcBox = srcEl.getBoundingClientRect();
      clearTimeout(showProof._st);
      showProof._st = setTimeout(() => { S.tourScrolling = false; }, 120);
    }
  }

  const w = document.getElementById("wires");
  w.setAttribute("viewBox", `0 0 ${window.innerWidth} ${window.innerHeight}`);
  w.setAttribute("width", String(window.innerWidth));
  w.setAttribute("height", String(window.innerHeight));

  rows.forEach(row => {
    row.classList.add("is-lit");
    const rr = row.getBoundingClientRect();
    const midY = rr.top + rr.height / 2;
    if (rr.width > 0 && midY >= srcBox.top + 8 && midY <= srcBox.bottom - 8) {
      appendWireNodes(w, x1, y1, rr.right, midY);
    }
  });
  rects.forEach(rect => {
    rect.classList.add("is-on");
    const rb = rect.getBoundingClientRect();
    if (rb.width > 0) {
      appendWireNodes(w, x1, y1, rb.left + rb.width / 2, rb.top + rb.height / 2);
    }
  });
}

async function runProofTour(runId) {
  if (S.step < 4 || S.vue !== "nexity" || S.zoom || !gen[S.lot]) return;
  const items = Array.from(document.querySelectorAll("#app .pf, #app .prest"));
  if (!items.length) return;
  for (let i = 0; i < Math.min(3, items.length); i++) {
    if (runId !== S.runId || S.step < 4 || S.vue !== "nexity" || S.zoom) return;
    const el = items[i];
    S.tourScrolling = true;
    el.scrollIntoView({ block: "nearest" });
    await sleep(60);
    S.tourScrolling = false;
    if (runId !== S.runId) return;
    showProof(el);
    await sleep(950);
  }
}

function animatePriceCount(fromVal, toVal, runId) {
  setTimeout(() => {
    if (runId !== S.runId) return;
    const t0 = performance.now();
    const dur = 700;
    function frame(now) {
      if (runId !== S.runId) return;
      const el = document.getElementById("sidePriceVal");
      if (!el) return;
      const p = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      const val = Math.round(fromVal + (toVal - fromVal) * eased);
      el.textContent = `${fmtPrice(val)} €`;
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }, 420);
}

function getLotBadge(lot) {
  const id = lot.lot_id;
  const s1 = surfById[id];
  const sold = lot.statut_mbi !== "DISPONIBLE";
  if (S.step === 0 && S.playing === 0) {
    if (sold) return { cls: "tag-sold", txt: "Vendu" };
    return { cls: "tag-wait", txt: "Reçu" };
  }
  if (s1 && s1.statut === "QUARANTAINE" && (S.step >= 1 || S.playing === 1)) {
    return { cls: "tag-quar", txt: "Quarantaine" };
  }
  if (sold) return { cls: "tag-sold", txt: S.step >= 2 ? "Exclu" : "Vendu" };
  if (S.step >= 3 && id === temoinId) return { cls: "tag-temoin", txt: "Témoin" };
  if (S.step >= 4 && gen[id]) return { cls: "tag-ok", txt: "Prêt" };
  return { cls: "tag-ok", txt: "Fiable" };
}

  const fluxPartial = appel && appel.flux_complet === false;

function getWorkNotice(lot) {
  const id = lot.lot_id;
  const s1 = surfById[id];
  const isQuar = s1 && s1.statut === "QUARANTAINE";
  const isSold = lot.statut_mbi !== "DISPONIBLE";
  const prod = R.productivite;

  if (S.playing === 1) return { msg: "Audit géométrique des plans 2D vs flux MBI en cours...", btn: "" };
  if (S.playing === 2) return { msg: `Mise à jour du prix d'appel : ${appel.ancien_lot} vendu → bascule sur ${appel.nouveau_lot}.`, btn: "" };
  if (S.playing === 3) return { msg: `Calcul des singularités sur ${id} et sélection du lot témoin...`, btn: "" };

  if (S.step === 0) {
    return {
      msg: `Lot ${id} chargé depuis le flux MBI. Lancez le contrôle surfaces pour auditer les plans 2D.`,
      btn: ""
    };
  }
  if (isQuar && S.step >= 1) {
    return {
      msg: `Publication bloquée sur ${id} : écart de ${fmtNum(s1.ecart_m2)} m² (${fmtNum(s1.ecart_pct)} %) entre MBI (${fmtNum(s1.surface_mbi)} m²) et plan 2D (${fmtNum(s1.surface_plan)} m²).`,
      btn: ""
    };
  }
  if (isSold) {
    const ex = exclusById[id];
    const dStr = ex && ex.depuis ? fmtDate(ex.depuis) : "";
    return {
      msg: S.step >= 2 && appel
        ? `Lot ${id} exclu (vendu${dStr ? ` le ${dStr}` : ""}). Prix d'appel programme basculé sur ${appel.nouveau_lot} (${fmtPrice(appel.nouveau_prix)} €).`
        : `Lot ${id} marqué vendu dans le flux MBI${dStr ? ` (${dStr})` : ""}.`,
      btn: ""
    };
  }
  if (S.step === 1) {
    return { msg: `Surface ${id} conforme (${fmtNum(s1.surface_mbi)} m² MBI vs ${fmtNum(s1.surface_plan)} m² plan). Passez au prix d'appel.`, btn: "" };
  }
  if (S.step === 2) {
    return { msg: `Prix d'appel corrigé à ${fmtPrice(appel.nouveau_prix)} € (${appel.nouveau_lot}). Prêt pour l'analyse de singularités.`, btn: "" };
  }
  if (S.step === 3) {
    const nbS = (singById[id] || []).length;
    return { msg: `${nbS} singularités vérifiées sur le périmètre T3 (${R.etape3_perimetres.T3.nb_comparables} lots fiables). Prêt pour rédaction.`, btn: "" };
  }
  if (S.step === 4) {
    return { msg: `Fiche ${id} rédigée sans violation. Cliquez un point fort dans le mobile pour tracer ses preuves.`, btn: "" };
  }
  const btnLabel = S.temoinValide
    ? `Témoin validé · ${genIds.join(" + ")} prêts`
    : "Valider le lot témoin";
  const btnCls = S.temoinValide ? "btn-temoin is-done" : "btn-temoin";
  const gain = `${prod.lots_a_relire}/${prod.lots_generes} lot à relire · ${prod.minutes_relecture_temoin} vs ${prod.minutes_manuelles_par_lot * prod.lots_generes} min`;
  return {
    msg: S.temoinValide
      ? `Lot témoin ${temoinId} validé : publication autorisée pour ${genIds.join(" et ")}.`
      : `Relecture groupée sur le lot témoin ${temoinId} : une validation couvre ${genIds.join(" et ")}.`,
    btn: `<span class="notice-metric">${esc(gain)}</span><button id="btnTemoin" type="button" class="${btnCls}">${esc(btnLabel)}</button>`
  };
}

function parseFirstNum(str) {
  const m = String(str || "").match(/\d[\d\s\u202f\u00a0.,]*/);
  if (!m) return NaN;
  return parseFloat(m[0].replace(/[\s\u202f\u00a0]/g, "").replace(",", "."));
}

function renderSingularityBars(lot, sings) {
  const perim = R.etape3_perimetres && R.etape3_perimetres[lot.typologie];
  const scopeLabel = perim ? `sur ${perim.nb_comparables} T3 comparables reçus` : "périmètre vérifié";

  const forbiddenMap = {
    PLUS_GRAND_EXTERIEUR: "Le plus grand du programme",
    PLUS_GRANDE_SURFACE: "Le plus spacieux de la résidence",
    DERNIER_ETAGE: "Vue imprenable garantie",
    TRAVERSANT: "Luminosité maximale absolue",
    COEUR_ILOT: "Calme absolu garanti",
    PRIX_ACCES: "Meilleur prix de la ville",
    PRIX_M2: "Prix imbattable du secteur"
  };

  return sings.map(sg => {
    let barsHtml = "";
    if (sg.reference) {
      const vNum = parseFirstNum(sg.valeur);
      const rNum = parseFirstNum(sg.reference);
      if (Number.isFinite(vNum) && Number.isFinite(rNum) && Math.max(vNum, rNum) > 0) {
        const denom = Math.max(vNum, rNum);
        const wLot = Math.round((vNum / denom) * 100);
        const wRef = Math.round((rNum / denom) * 100);
        barsHtml = `
          <div class="sing-bar-track"><div class="sing-bar-fill" style="width:${wLot}%"></div></div>
          <div class="sing-bar-track is-ref"><div class="sing-bar-fill is-ref" style="width:${wRef}%"></div></div>
          <div class="sing-ref">Suivant : ${esc(sg.reference)}</div>
        `;
      }
    }

    const badPhrase = forbiddenMap[sg.code] || "Superlatif programme non borné";
    return `
      <div class="src-row" data-src-keys="SING.${esc(sg.code)}">
        <div class="sing-head">
          <span class="sing-lbl">${esc(sg.libelle)}</span>
          <span class="sing-val">${esc(sg.valeur)}</span>
        </div>
        ${barsHtml}
        <div class="sing-guard">
          <span class="struck-bad">${esc(badPhrase)}</span>
          <span class="scope-ok">${esc(scopeLabel)}</span>
        </div>
      </div>
    `;
  }).join("");
}

function renderProofSources(lot) {
  const id = lot.lot_id;
  const s1 = surfById[id];
  const isQuar = s1 && s1.statut === "QUARANTAINE" && (S.step >= 1 || S.playing === 1);
  const isSold = lot.statut_mbi !== "DISPONIBLE";
  const sings = singById[id] || [];
  const clauses = (R.notice && R.notice.clauses_extraites) || [];
  const parts = [];

  if (isQuar) {
    const items = (s1.motifs || []).map(m => `<li>${esc(m)}</li>`).join("");
    parts.push(`
      <div class="src-block">
        <div class="src-block-title is-alert"><span>Blocage · Quarantaine</span><span>Règle surface</span></div>
        <ul class="alert-list">${items}</ul>
      </div>
    `);
  } else if (isSold) {
    const ex = exclusById[id];
    parts.push(`
      <div class="src-block">
        <div class="src-block-title is-alert"><span>Exclusion · Statut MBI</span><span>${esc(lot.statut_mbi)}</span></div>
        <ul class="alert-list">
          <li>Lot retiré${ex && ex.depuis ? ` le ${esc(fmtDate(ex.depuis))}` : ""} : aucune fiche publiée.</li>
          ${S.step >= 2 && appel ? `<li>Prix d'appel programme basculé de ${esc(appel.ancien_lot)} (${fmtPrice(appel.ancien_prix)} €) vers ${esc(appel.nouveau_lot)} (${fmtPrice(appel.nouveau_prix)} €).</li>` : ""}
        </ul>
      </div>
    `);
  }

  parts.push(`
    <div class="src-block">
      <div class="src-block-title"><span>Flux MBI · ${esc(id)}</span><span>MBI</span></div>
      <div class="src-row" data-src-keys="MBI.surface_habitable_mbi,SING.PLUS_GRANDE_SURFACE">
        <div class="src-kv"><span class="src-k">Surface hab.</span><span class="src-v">${fmtNum(lot.surface_habitable_mbi)} m²</span></div>
      </div>
      <div class="src-row" data-src-keys="MBI.exterieur_type,MBI.exterieur_m2">
        <div class="src-kv"><span class="src-k">Extérieur</span><span class="src-v">${lot.exterieur_type ? `${esc(lot.exterieur_type)} ${fmtNum(lot.exterieur_m2)} m²` : "Aucun"}</span></div>
      </div>
      <div class="src-row" data-src-keys="MBI.exposition,MBI.etage">
        <div class="src-kv"><span class="src-k">Expo · Étage</span><span class="src-v">${esc(lot.exposition)} · R+${lot.etage}</span></div>
      </div>
      <div class="src-row" data-src-keys="MBI.prix_ttc,MBI.prix_m2,SING.PRIX_ACCES,SING.PRIX_M2">
        <div class="src-kv"><span class="src-k">Prix · €/m²</span><span class="src-v">${fmtPrice(lot.prix_ttc)} € · ${fmtPrice(lot.prix_m2)} €/m²</span></div>
      </div>
      <div class="src-row" data-src-keys="MBI.tva_reduite_5_5_eligible,MBI.ptz_eligible">
        <div class="src-kv"><span class="src-k">Atouts</span><span class="src-v">${lot.ptz_eligible ? "PTZ · " : ""}${lot.tva_reduite_5_5_eligible ? "TVA 5,5% · " : ""}${lot.parking_inclus ? "1 pkg" : "0 pkg"}</span></div>
      </div>
    </div>
  `);

  if (sings.length) {
    parts.push(`
      <div class="src-block">
        <div class="src-block-title"><span>Singularités</span><span>${S.step >= 3 || S.playing === 3 ? `${sings.length} prouvées` : "En attente"}</span></div>
        ${S.step >= 3 || S.playing === 3
          ? renderSingularityBars(lot, sings)
          : `<div class="src-row"><div class="clause-txt">Comparaison sur le périmètre T3 exécutée à l'étape 3 (Singularités).</div></div>`}
      </div>
    `);
  }

  parts.push(`
    <div class="src-block">
      <div class="src-block-title"><span>Notice descriptive</span><span>${clauses.length} clauses</span></div>
      ${clauses.map(cl => `
        <div class="src-row" data-src-keys="${esc(cl.id)}">
          <div><span class="clause-id">${esc(cl.id)}</span><span class="clause-rub">p. ${cl.page} · ${esc(cl.rubrique)}</span></div>
          <div class="clause-txt">${esc(cl.texte_contractuel)}</div>
        </div>
      `).join("")}
    </div>
  `);

  document.getElementById("proofSources").innerHTML = parts.join("");
}

        ${prests}
        <div class="mentions">${mentions}</div>
      </div>
    </div>
  `;
}

function bindPhoneHandlers() {
  const slider = document.getElementById("lpSlider");
  if (slider) {
    const onSlide = e => {
      S.slide = Number(e.target.value) || 0;
      const img = document.getElementById("lpSlideImg");
      const lbl = document.getElementById("lpSlideLbl");
      if (img) img.src = slideImg();
      if (lbl) lbl.textContent = slideLabel();
    };
    slider.addEventListener("input", onSlide);
    slider.addEventListener("change", e => {
      onSlide(e);
      e.target.blur();
    });
  }

  document.querySelectorAll("#app .pf, #app .prest").forEach(el => {
    el.addEventListener("mouseenter", () => showProof(el));
    el.addEventListener("click", ev => {
      ev.stopPropagation();
      S.litTarget = el;
      showProof(el);
    });
  });
}

function renderPhone() {
  renderPhoneControls();
  const lot = lotsById[S.lot] || R.lots[0];
  const app = document.getElementById("app");
  clearWires();
  app.innerHTML = S.vue === "portail" ? renderPhonePortal(lot) : renderPhoneNexityStatic(lot);
  bindPhoneHandlers();
}

async function runTypingForCurrentLot(runId) {
  const id = S.lot;
  if (!gen[id] || S.step < 4 || S.vue !== "nexity" || S.typed[id]) return;
  const targets = Array.from(document.querySelectorAll("#app [data-type-text]"));
  if (!targets.length) {
    S.typed[id] = true;
    return;
  }

  const fullTexts = targets.map(el => el.getAttribute("data-type-text") || "");
  const domSlots = targets.map(el => {
    const slot = el.classList.contains("pf") ? el.querySelector(".pf-txt")
      : el.classList.contains("prest") ? el.querySelector(".prest-txt")
      : el;
    slot.textContent = "";
    return slot;
  });

  const totalChars = Math.max(1, fullTexts.reduce((a, b) => a + b.length, 0));
  const perCharMs = Math.min(14, Math.max(4, Math.floor(4200 / totalChars)));
  S.typing = true;
  S.skipTyping = false;

  const finishEarly = () => { S.skipTyping = true; };
  const appEl = document.getElementById("app");
  appEl.addEventListener("click", finishEarly, { once: true });

  const caret = document.createElement("span");
  caret.className = "caret";

  for (let t = 0; t < targets.length; t++) {
    const txt = fullTexts[t];
    const slot = domSlots[t];
    if (S.skipTyping || runId !== S.runId) break;
    slot.appendChild(caret);
    for (let c = 1; c <= txt.length; c++) {
      if (S.skipTyping || runId !== S.runId) break;
      slot.textContent = txt.slice(0, c);
      slot.appendChild(caret);
      if (c % 2 === 0 || perCharMs >= 8) await sleep(perCharMs);
    }
  }
  if (caret.parentNode) caret.parentNode.removeChild(caret);
  S.typing = false;
  S.skipTyping = false;

  if (runId !== S.runId) return;
  domSlots.forEach((slot, idx) => { slot.textContent = fullTexts[idx]; });
  S.typed[id] = true;
  await runProofTour(runId);
}

function renderRail() {
  const nbQuar = (R.etape1_surfaces || []).filter(s => s.statut === "QUARANTAINE").length;
  const totalSing = Object.values(singById).reduce((acc, arr) => acc + (arr ? arr.length : 0), 0);
  const s1Sub = S.step >= 1 ? `${nbQuar} quarantaine · ${qLotId}` : "En attente";
  const s2Sub = S.step >= 2 && appel
    ? `${appel.ancien_lot} → ${appel.nouveau_lot} (${fmtK(appel.nouveau_prix)})`
    : "En attente";
  const s3Sub = S.step >= 3 ? `${totalSing} preuves · ${temoins.length} témoin` : "En attente";
  const s4Sub = S.step >= 4 ? `${genIds.length} fiches · 0 violation` : "En attente";
  const s5Sub = S.step >= 5
    ? (S.temoinValide ? "Validé · prêt" : `Relecture ${temoinId}`)
    : "En attente";

  const steps = [
    { n: 1, l1: "1 · Surfaces & plans", l2: s1Sub },
    { n: 2, l1: "2 · Prix & exclus", l2: s2Sub },
    { n: 3, l1: "3 · Singularités", l2: s3Sub },
    { n: 4, l1: "4 · Rédaction", l2: s4Sub },
    { n: 5, l1: "5 · Validation", l2: s5Sub }
  ];

  const stepsHtml = steps.map(st => {
    const done = S.step >= st.n;
    const curr = S.playing === st.n || (S.playing === 0 && S.step === st.n);
    const cls = curr ? " is-curr" : (done ? " is-done" : " is-pend");
    return `
      <button type="button" class="rail-step${cls}" data-rail-step="${st.n}" ${done ? "" : "aria-disabled=\"true\""}>
        <div class="rs-l1">${esc(st.l1)}</div>
        <div class="rs-l2">${esc(st.l2)}</div>
      </button>
    `;
  }).join("");

  let nextTxt = "Démarrer : Contrôle surfaces";
  if (S.playing === 1) nextTxt = "Scan surfaces...";
  else if (S.playing === 2) nextTxt = "Mise à jour prix...";
  else if (S.playing === 3) nextTxt = "Analyse singularités...";
  else if (S.step === 1) nextTxt = "Mettre à jour prix d'appel";
  else if (S.step === 2) nextTxt = "Analyser singularités";
  else if (S.step === 3) nextTxt = "Rédiger les fiches";
  else if (S.step === 4) nextTxt = "Ouvrir validation témoin";
  else if (S.step === 5 && !S.temoinValide) nextTxt = "Valider le lot témoin";
  else if (S.step === 5 && S.temoinValide) nextTxt = "Cycle complet · Reset";

  document.getElementById("rail").innerHTML = `
    <div class="rail-steps">${stepsHtml}</div>
    <div class="rail-actions">
      <button id="btnAuto" type="button" class="btn-auto">${S.playing ? "en cours..." : "tout dérouler"}</button>
      <button id="btnNext" type="button" class="btn-next">${esc(nextTxt)}</button>
    </div>
  `;
}

function render() {
  const lot = lotsById[S.lot] || R.lots[0];
  renderTopbar();
  renderSidebar();
  renderWorkHeadAndNotice(lot);
  renderProofPlan(lot);
  renderProofSources(lot);
  renderPhone();
  renderRail();
}

function openZoom() {
  const lot = lotsById[S.lot];
  if (!lot || !lot.plan_2d_fichier) return;
  S.zoom = true;
  clearWires();
  document.getElementById("zoomTitle").textContent = `Plan 2D · Lot ${lot.lot_id} (${lot.plan_2d_fichier})`;
  document.getElementById("zoomBody").innerHTML = `<img src="${planURI(lot.lot_id)}" alt="Plan ${esc(lot.lot_id)}">`;
  document.getElementById("zoomModal").classList.add("is-open");
}

function closeZoom() {
  S.zoom = false;
  document.getElementById("zoomModal").classList.remove("is-open");
}

function focusRailStep(n) {
  if (S.step < n || S.playing !== 0) return;
  S.runId++;
  stopTour();
  if (n === 1) S.lot = qLotId;
  else if (n === 2) S.lot = appelOldId;
  else if (n === 3) S.lot = temoinId;
  else if (n === 4 || n === 5) {
    S.lot = temoinId;
    S.vue = "nexity";
    S.typed[S.lot] = true;
  }
  render();
  if (n === 4 && S.vue === "nexity") runProofTour(S.runId);
}

async function avancer(customId) {
  const id = customId ?? ++S.runId;
  stopTour();

  if (S.step === 5 && !S.temoinValide) {
    S.temoinValide = true;
    render();
    toast(`Lot témoin ${temoinId} validé : ${genIds.join(" et ")} prêts à publier`);
    return;
  }
  if (S.step === 5 && S.temoinValide) {
    reset();
    return;
  }

  if (S.step === 0) {
    S.playing = 1;
    render();
    await sleep(2000);
    if (id !== S.runId) return;
    S.playing = 0;
    S.step = 1;
    S.lot = qLotId;
    render();
    return;
  }

  if (S.step === 1) {
    S.playing = 2;
    render();
    if (appel) animatePriceCount(appel.ancien_prix, appel.nouveau_prix, id);
    await sleep(1400);
    if (id !== S.runId) return;
    S.playing = 0;
    S.step = 2;
    S.lot = appelOldId;
    render();
    return;
  }

  if (S.step === 2) {
    S.lot = temoinId;
    S.playing = 3;
    render();
    await sleep(1200);
    if (id !== S.runId) return;
    S.playing = 0;
    S.step = 3;
    render();
    return;
  }

  if (S.step === 3) {
    S.step = 4;
    S.lot = temoinId;
    S.vue = "nexity";
    S.typed[S.lot] = false;
    render();
    await runTypingForCurrentLot(id);
    return;
  }

  if (S.step === 4) {
    S.step = 5;
    S.lot = temoinId;
    S.vue = "nexity";
    S.typed[S.lot] = true;
    render();
  }
}

async function toutDerouler() {
  const id = ++S.runId;
  if (S.step === 5 && S.temoinValide) reset();
  while (S.step < 5) {
    if (id !== S.runId) return;
    await avancer(id);
    if (id !== S.runId) return;
    if (S.step < 5) await sleep(900);
  }
}

function reculer() {
  S.runId++;
  S.playing = 0;
  stopTour();
  if (S.temoinValide) {
    S.temoinValide = false;
    render();
    return;
  }
  if (S.step > 0) {
    S.step--;
    if (S.step === 1) S.lot = qLotId;
    else if (S.step === 2) S.lot = appelOldId;
    else S.lot = temoinId;
    if (S.step < 4 && S.vue === "nexity") S.vue = "portail";
    render();
  }
}

function reset() {
  S.runId++;
  S.step = 0;
  S.playing = 0;
  S.typing = false;
  S.skipTyping = false;
  S.lot = genIds[0] || "B31";
  S.vue = "portail";
  S.slide = 0;
  S.temoinValide = false;
  S.typed = {};
  closeZoom();
  stopTour();
  render();
}

function selectLot(id) {
  if (!lotsById[id]) return;
  S.runId++;
  S.playing = 0;
  S.typing = false;
  S.skipTyping = false;
  stopTour();
  S.lot = id;
  if (S.step >= 4 && S.vue === "nexity" && gen[id]) {
    S.typed[id] = true;
  }
  render();
}

function bindEvents() {
  document.getElementById("btnReset").addEventListener("click", reset);
  document.getElementById("zoomClose").addEventListener("click", closeZoom);
  document.getElementById("zoomModal").addEventListener("click", e => {
    if (e.target.id === "zoomModal") closeZoom();
  });

  document.getElementById("side").addEventListener("click", e => {
    const btn = e.target.closest("[data-select-lot]");
    if (btn) selectLot(btn.getAttribute("data-select-lot"));
  });

  document.getElementById("work").addEventListener("click", e => {
    if (e.target.closest("#btnZoomPlan")) openZoom();
    if (e.target.closest("#btnTemoin")) {
      S.temoinValide = !S.temoinValide;
      render();
      if (S.temoinValide) toast(`Lot témoin ${temoinId} validé`);
    }
  });

  document.getElementById("segVue").addEventListener("click", e => {
    const btn = e.target.closest("[data-vue]");
    if (!btn) return;
    S.runId++;
    S.typing = false;
    S.skipTyping = false;
    stopTour();
    S.vue = btn.getAttribute("data-vue");
    if (S.vue === "nexity" && S.step >= 4 && gen[S.lot]) S.typed[S.lot] = true;
    render();
  });

  document.getElementById("segLot").addEventListener("click", e => {
    const btn = e.target.closest("[data-lot-btn]");
    if (btn) selectLot(btn.getAttribute("data-lot-btn"));
  });

  document.getElementById("rail").addEventListener("click", e => {
    if (e.target.closest("#btnNext")) {
      if (S.typing) { S.skipTyping = true; return; }
      if (S.playing === 0) avancer();
      return;
    }
    if (e.target.closest("#btnAuto")) {
      if (S.playing === 0 && !S.typing) toutDerouler();
      return;
    }
    const stepBtn = e.target.closest("[data-rail-step]");
    if (stepBtn) focusRailStep(Number(stepBtn.getAttribute("data-rail-step")));
  });

  document.getElementById("app").addEventListener("scroll", () => {
    if (!S.tourScrolling) clearWires();
  });
  document.getElementById("proofSources").addEventListener("scroll", () => {
    if (!S.tourScrolling) clearWires();
  });
  window.addEventListener("resize", () => clearWires());

  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = e.target && e.target.matches
      ? e.target.matches("input:not([type='range']), textarea, select, [contenteditable='true']")
      : false;
    if (tag) return;

    if (e.target && e.target.id === "lpSlider" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
      return;
    }

    const k = e.key.toLowerCase();
    if (k === "escape") {
      if (S.zoom) {
        e.preventDefault();
        closeZoom();
      }
      return;
    }
    if (e.code === "Space" || e.key === "ArrowRight") {
      e.preventDefault();
      if (S.zoom) { closeZoom(); return; }
      if (S.typing) { S.skipTyping = true; return; }
      if (S.playing === 0) avancer();
      return;
    }
    if (e.key === "ArrowLeft") {
      e.preventDefault();
      reculer();
      return;
    }
    if (k === "r") {
      e.preventDefault();
      reset();
      return;
    }
    if (k === "p") {
      e.preventDefault();
      S.runId++;
      stopTour();
      S.vue = S.vue === "portail" ? "nexity" : "portail";
      if (S.vue === "nexity" && S.step >= 4 && gen[S.lot]) S.typed[S.lot] = true;
      render();
      return;
    }
    if (k === "l") {
      e.preventDefault();
      if (genIds.length) {
        const idx = genIds.indexOf(S.lot);
        selectLot(genIds[(idx + 1) % genIds.length]);
      }
      return;
    }
    if (k === "z") {
      e.preventDefault();
      if (S.zoom) closeZoom();
      else openZoom();
      return;
    }
    if (k === "t") {
      e.preventDefault();
      if (S.step >= 4 && gen[S.lot] && !S.zoom) {
        S.vue = "nexity";
        S.typed[S.lot] = true;
        render();
        runProofTour(++S.runId);
      }
    }
  });
}

render();
bindEvents();
</script>
</body>
</html>
