<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820">
  <defs>
    <pattern id="woodDeck" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#E8EFE8"/>
      <line x1="0" y1="8" x2="16" y2="8" stroke="#D5CBBF" stroke-width="1"/>
    </pattern>
    <pattern id="tiles" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#FAF8F5"/>
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ECE7DF" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Sheet Background -->
  <rect width="1200" height="820" fill="#FFFFFF"/>
  <rect x="20" y="20" width="1160" height="780" fill="none" stroke="#1E2328" stroke-width="2"/>

  

  <!-- Compass Rose -->
  <g transform="translate(805, 115)">
    <circle cx="0" cy="0" r="34" fill="#FAF8F5" stroke="#1E2328" stroke-width="1.5"/>
    <polygon points="0,-26 7,0 0,-6 -7,0" fill="#FF002D"/>
    <polygon points="0,26 7,0 0,6 -7,0" fill="#98A2B3"/>
    <text x="-5" y="-39" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E2328">N</text>
    <text x="-48" y="5" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475467">O</text>
    <text x="39" y="5" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475467">E</text>
    <text x="-4" y="48" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FF002D">S</text>
    <text x="-58" y="68" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E2328">Expo : Sud-Est</text>
  </g>

  <!-- Outdoor Space (Terrace / Balcony) -->
  <rect x="90" y="130" width="620" height="75" fill="url(#woodDeck)" stroke="#475467" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="115" y="164" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E2328">BALCON COUVERT — 6,50 m²</text>
  <text x="115" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475467">Dalles bois / Garde-corps aluminium thermolaqué champagne</text>

  <!-- Main Structural Envelope (Murs porteurs 20cm) -->
  <rect x="90" y="215" width="620" height="510" fill="#FAF8F5" stroke="#111111" stroke-width="12"/>

  <!-- Living Room + Kitchen (Séjour / Cuisine) -->
  <rect x="96" y="221" width="354" height="310" fill="url(#tiles)" stroke="#1E2328" stroke-width="3"/>
  <!-- Sliding Glass Bays (Baies vitrées coulissantes) -->
  <line x1="140" y1="215" x2="390" y2="215" stroke="#38BDF8" stroke-width="10"/>
  <line x1="140" y1="212" x2="275" y2="212" stroke="#0284C7" stroke-width="2"/>
  <line x1="255" y1="218" x2="390" y2="218" stroke="#0284C7" stroke-width="2"/>

  <!-- Kitchen technical hookups zone (Attentes cuisine notice p.16) -->
  <rect x="102" y="455" width="185" height="70" fill="#F2EFE9" stroke="#667085" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="135" cy="490" r="9" fill="none" stroke="#475467" stroke-width="1.5"/>
  <circle cx="170" cy="490" r="9" fill="none" stroke="#475467" stroke-width="1.5"/>
  <text x="108" y="472" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#344054">ZONE CUISINE (Attentes livrées)</text>
  <text x="108" y="516" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#667085">Évacuation + 6 prises (Notice p.16)</text>

  <text x="195" y="335" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#111111">SÉJOUR / CUISINE</text>
  <text x="230" y="360" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FF002D">25,80 m²</text>
  <text x="180" y="382" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475467">Grès cérame 45x45 • Volets motorisés</text>

  <!-- Bedroom 1 (Chambre 1) -->
  <rect x="450" y="221" width="254" height="245" fill="#FFFFFF" stroke="#1E2328" stroke-width="4"/>
  <line x1="515" y1="215" x2="640" y2="215" stroke="#38BDF8" stroke-width="9"/>
  <rect x="456" y="420" width="120" height="42" fill="#F2EFE9" stroke="#667085" stroke-width="1"/>
  <text x="478" y="446" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#475467">Placard prévu</text>
  <text x="520" y="325" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111111">CHAMBRE 1</text>
  <text x="542" y="348" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E2328">11,80 m²</text>
  <text x="505" y="368" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#667085">Parquet stratifié chêne clair</text>

  <!-- Bedroom 2 (Chambre 2) -->
  <rect x="450" y="466" width="254" height="253" fill="#FFFFFF" stroke="#1E2328" stroke-width="4"/>
  <line x1="710" y1="530" x2="710" y2="635" stroke="#38BDF8" stroke-width="9"/>
  <text x="520" y="585" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111111">CHAMBRE 2</text>
  <text x="542" y="608" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E2328">10,10 m²</text>

  <!-- Bathroom (Salle de bain) -->
  <rect x="255" y="531" width="195" height="188" fill="url(#tiles)" stroke="#1E2328" stroke-width="4"/>
  <rect x="268" y="655" width="130" height="54" rx="8" fill="#FFFFFF" stroke="#475467" stroke-width="1.5"/>
  <text x="292" y="585" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111111">SALLE DE BAIN</text>
  <text x="322" y="606" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E2328">5,40 m²</text>
  <text x="276" y="626" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#667085">Meuble vasque + sèche-serviettes</text>

  <!-- Entrance + Hallway + WC (Entrée / Dégagement / WC) -->
  <rect x="96" y="531" width="159" height="118" fill="#FAF8F5" stroke="#1E2328" stroke-width="4"/>
  <text x="122" y="582" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111111">ENTRÉE / DGT</text>
  <text x="148" y="603" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E2328">6,10 m²</text>

  <rect x="96" y="649" width="159" height="70" fill="#FFFFFF" stroke="#1E2328" stroke-width="4"/>
  <text x="145" y="688" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">WC 2,00 m²</text>

  <!-- Entry Door Indicator -->
  <line x1="145" y1="725" x2="205" y2="725" stroke="#FF002D" stroke-width="8"/>
  <text x="132" y="752" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FF002D">▲ ENTRÉE PALIER</text>

  <!-- Cotes dimensionnelles -->
  <line x1="90" y1="772" x2="710" y2="772" stroke="#667085" stroke-width="1"/>
  <text x="365" y="766" font-family="Courier, monospace" font-size="12" fill="#344054">8,45 m (façade totale)</text>

  <!-- ARCHITECTURAL CARTOUCHE (Right Panel) -->
  <g transform="translate(755, 215)">
    <rect x="0" y="0" width="400" height="510" rx="6" fill="#FAF8F5" stroke="#1E2328" stroke-width="2"/>
    <rect x="0" y="0" width="400" height="64" rx="6" fill="#111111"/>
    <text x="24" y="42" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FF002D">nexity</text>
    <text x="135" y="40" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">PLAN DE VENTE VEFA</text>

    <text x="24" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#667085">PROGRAMME IMMOBILIER</text>
    <text x="24" y="122" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#111111">L'ORÉE SEINE — ASNIÈRES (92)</text>
    <text x="24" y="144" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475467">Livraison prévisionnelle : 3e trimestre 2028 • RE2020</text>

    <line x1="24" y1="164" x2="376" y2="164" stroke="#D0D5DD" stroke-width="1"/>

    <text x="24" y="192" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#667085">RÉFÉRENCE DU LOT</text>
    <text x="24" y="222" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#111111">LOT B12 — T3</text>
    <text x="24" y="246" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#344054">Vue dégagée jardin intérieur calme • 1er étage</text>

    <!-- Highlighted Surface Box (Crucial for B3/B2 Vision check!) -->
    <rect x="24" y="268" width="352" height="86" rx="6" fill="#FFFFFF" stroke="#FF002D" stroke-width="2.5"/>
    <text x="40" y="294" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#475467">SURFACE HABITABLE CARTOUCHE ARCHITECTE</text>
    <text x="40" y="334" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#111111">61,20 m²</text>
    <text x="235" y="332" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#475467">+ Balcon couvert 6,50 m²</text>

    <!-- Room Table -->
    <text x="24" y="382" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#344054">DÉTAIL DES SURFACES PRIVATIVES</text>
    <text x="24" y="404" font-family="Courier, monospace" font-size="12" fill="#344054">Séjour / Cuisine ....... 25,80 m²</text>
    <text x="24" y="422" font-family="Courier, monospace" font-size="12" fill="#344054">Chambre 1 .............. 11,80 m²</text>
    <text x="24" y="440" font-family="Courier, monospace" font-size="12" fill="#344054">Chambre 2 .............. 10,10 m²</text>
    <text x="24" y="458" font-family="Courier, monospace" font-size="12" fill="#344054">Salle de bain + WC ..... 7,40 m²</text>
    <text x="24" y="476" font-family="Courier, monospace" font-size="12" fill="#344054">Entrée / Dégagement .... 6,10 m²</text>

    <text x="24" y="500" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#667085">Tolérance légale VEFA ±5 %. Cuisine et mobilier non fournis (cf. Notice Descriptive).</text>
  </g>
</svg>